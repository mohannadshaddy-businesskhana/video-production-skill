<!doctype html>
<!--
  Demo 04 — series: episode @@N@@ of 3, «@@TYPE@@».

  GENERATED by demos/_src/series/emit.mjs — edit it there, never this file.

  "نوع النهارده" — one video type a day, six seconds each. Every episode is
  this template with one row of data (routes/section-series.md: everything
  that varies lives in one table; the timeline never changes). The badge, the
  sting, the timing and the sound are identical in every episode; only the
  type, its line, its sample and tomorrow's teaser change.

  The sample is the type's own demo, not a mock-up of it: a six-second
  excerpt of its real render, muted under the series' own sound.
-->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>نوع النهارده — @@TYPE@@</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); background:var(--ink); }
      .scene { position:absolute; inset:0; }

      /* the series' fixed frame: the badge, the type, the sample, the line */
      #badge { position:absolute; right:88px; top:250px; width:904px; direction:rtl; text-align:right;
               font-size:34px; font-weight:700; line-height:1.3; color:rgba(245,242,234,.72); }
      #badge b { color:var(--amber); font-weight:800; }
      #type  { position:absolute; right:88px; top:342px; width:904px; direction:rtl; text-align:right;
               font-size:88px; font-weight:800; line-height:1.25; color:var(--bone);
               transform-origin:100% 50%; }
      #sample { position:absolute; left:285px; top:490px; width:510px; height:907px;
                border-radius:18px; object-fit:cover; background:var(--ink); }
      #frame { position:absolute; left:277px; top:482px; width:526px; height:923px;
               border-radius:24px; border:6px solid var(--amber); }
      .ln { position:absolute; right:88px; top:1440px; width:904px; direction:rtl; text-align:right;
            font-size:56px; font-weight:800; line-height:1.3; letter-spacing:-.01em;
            text-wrap:balance; visibility:hidden; }
      .ln .x { color:var(--amber); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6"
         data-fps="30" data-width="1080" data-height="1920">
      <video id="sample" class="clip" src="media/sample.mp4" muted playsinline
             data-start="0" data-duration="6" data-media-start="@@FROM@@" data-track-index="1"></video>
      <section id="ep" class="scene clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="frame"></div>
        <div id="badge">نوع النهارده · <b>@@COUNT@@</b></div>
        <div id="type">@@TYPE@@</div>
        <div class="ln" id="body">@@BODY@@</div>
        <div class="ln" id="next"><span class="x">بكرة:</span> @@NEXT@@</div>
      </section>
      <!-- the series' own sound, the same in every episode: the bed from its top, a sting, a chime -->
      <audio id="bgm" src="assets/music/bed.mp3" data-start="0" data-duration="6"
             data-track-index="10" data-volume="1"></audio>
      <audio id="sting" src="assets/sfx/pop.mp3" data-start="0" data-duration="0.72"
             data-track-index="11" data-volume="0.4"></audio>
      <audio id="bell" src="assets/sfx/chime.mp3" data-start="4" data-duration="1.9"
             data-track-index="12" data-volume="0.35"></audio>
    </div>

    <script>
const E = @@EPISODE@@;
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;
const END = 180, BODY = 60, NEXT = 120;     // the template's clock — identical in every episode

function build() {
  const tl = gsap.timeline({ paused: true });
  /* the sting: the type slams in on frame 0, in three stepped states */
  gsap.set("#type", { scale: 1.12 });
  [[1, 1.05], [2, 1.015], [3, 1]].forEach(([d, k]) => tl.set("#type", { scale: k }, F(d)));
  /* the line: what the type is for, then tomorrow's */
  tl.set("#body", { visibility: "visible" }, F(BODY));
  tl.set("#body", { visibility: "hidden" }, F(NEXT));
  tl.set("#next", { visibility: "visible" }, F(NEXT));

  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.34, duration: F(3), ease: "none",
            immediateRender: false }, 0);
  // out cleanly, so episodes sit back to back without a click between them
  tl.to("#bgm", { volume: 0, duration: F(15), ease: "none" }, F(END - 15));

  mf("badge", { type: "text", chapter: "ep", frames: [0, END], still_from: 0,
                text: E.badge, critical: true, el: "#badge" });
  mf("type", { type: "text", chapter: "ep", frames: [0, END], still_from: 4,
               text: E.type, critical: true, el: "#type" });
  mf("body", { type: "text", chapter: "ep", frames: [BODY, NEXT], still_from: BODY,
               text: E.body, critical: true, el: "#body" });
  mf("next", { type: "text", chapter: "ep", frames: [NEXT, END], still_from: NEXT,
               text: E.next, critical: true, el: "#next" });
  mf("sample", { type: "video", chapter: "ep", frames: [0, END], still_from: 0,
                 critical: false, el: "#sample" });
  mf("frame", { type: "shape", chapter: "ep", frames: [0, END], still_from: 0,
                critical: false, el: "#frame" });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
