<!doctype html>
<!-- Demo 05 — faceless explainer.  A diagram that draws itself on paper: two
     nodes, one arrow, and the arrow is the whole argument.
     HOOK 0–3 · VALUE 3–14 · CTA 14–18 -->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>الفيديو بيراجع نفسه</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; --amber-tx:#AC6C11; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#FFFFFF; }
      /* the explainer is the only one on plain white — it should read as a
         sheet of paper someone is drawing on, not as a designed frame */
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--ink); background:var(--white); }
      .scene { position:absolute; inset:0; overflow:hidden; background:var(--white); }
      .pane  { position:absolute; inset:0; direction:rtl; }
      .line  { position:absolute; right:88px; width:904px; font-weight:600;
               line-height:1.36; letter-spacing:-.01em; }
      .xl { font-size:92px; } .lg { font-size:64px; } .md { font-size:50px; }
      .amber { color:var(--amber-tx); }
      .red   { color:var(--fail); }

      /* ruled paper, faint */
      .rule { position:absolute; left:0; right:0; height:3px; background:rgba(20,24,31,.07); }

      svg { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:visible; }
      .nd  { fill:none; stroke:var(--ink); stroke-width:7; }
      .nd.fill { fill:rgba(199,123,14,.12); }
      .ar  { fill:none; stroke:var(--ink); stroke-width:8; stroke-linecap:round; }
      .ar.bad { stroke:var(--fail); }
      .hd  { fill:var(--ink); } .hd.bad { fill:var(--fail); }
      .nlbl { position:absolute; font-family:"Cairo",sans-serif; font-weight:700;
              font-size:44px; text-align:center; color:var(--ink); }
      .nnum { position:absolute; font-family:"Mono",monospace; font-weight:700;
              font-size:56px; text-align:center; }

      .name { position:absolute; right:88px; top:1520px; width:904px;
              font-family:"Mono",monospace; font-size:40px; letter-spacing:.06em;
              color:var(--amber-tx); direction:ltr; text-align:right; font-weight:700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-fps="30" data-width="1080" data-height="1920">

      <section id="ch1" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="pane">
          <div class="line xl" id="h1" style="top:340px">الفيديو بيقدر<br>يراجع <span class="amber">نفسه</span>.</div>
          <svg viewBox="0 0 1080 1920"><circle id="h2" class="nd fill" cx="540" cy="1230" r="200"/></svg>
          <div class="nlbl" id="h3" style="left:290px; top:1200px; width:500px">فيديو</div>
        </div>
      </section>

      <section id="ch2" class="scene clip" data-start="3" data-duration="6" data-track-index="1">
        <div class="pane">
          <div class="line lg" id="a1" style="top:300px">المراجعة البشرية<br>بتفوّت اللي اتعوّدت عليه.</div>
          <div class="line md" id="a2" style="top:620px">التركيب بيكتب مكان كل عنصر.</div>
          <div class="line md" id="a3" style="top:760px">وبرنامج تاني بيقيس الفعلي.</div>
          <svg viewBox="0 0 1080 1920">
            <rect id="a4" class="nd fill" x="600" y="1000" width="380" height="240" rx="18"/>
            <rect id="a5" class="nd fill" x="100" y="1000" width="380" height="240" rx="18"/>
            <path id="a6" class="ar" d="M 595 1120 L 490 1120"/>
            <path id="a7" class="hd" d="M 486 1120 l 26 -16 v 32 z"/>
          </svg>
          <div class="nlbl" id="a8" style="left:600px; top:1090px; width:380px">المُعلَن</div>
          <div class="nlbl" id="a9" style="left:100px; top:1090px; width:380px">المقيس</div>
          <div class="line md" id="a10" style="top:1360px">لو الاتنين مختلفين، في غلطة.</div>
        </div>
      </section>

      <section id="ch3" class="scene clip" data-start="9" data-duration="5" data-track-index="2">
        <div class="pane">
          <div class="line lg" id="b1" style="top:300px">الاتنين متفقين؟ يعدّي.<br><span class="red">مختلفين؟ يقف.</span></div>
          <svg viewBox="0 0 1080 1920">
            <rect class="nd fill" x="600" y="1020" width="380" height="240" rx="18" id="b2"/>
            <rect class="nd fill" x="100" y="1020" width="380" height="240" rx="18" id="b3"/>
            <path id="b4" class="ar bad" d="M 595 1140 L 490 1140"/>
            <path id="b5" class="hd bad" d="M 486 1140 l 26 -16 v 32 z"/>
          </svg>
          <div class="nnum" id="b6" style="left:600px; top:1110px; width:380px; color:var(--ink)">٤٨٪</div>
          <div class="nnum" id="b7" style="left:100px; top:1110px; width:380px; color:#B23A2A">٣١٪</div>
          <div class="line md" id="b8" style="top:1400px">التسليم بيقف لحد ما تتصلّح.</div>
        </div>
      </section>

      <section id="ch4" class="scene clip" data-start="14" data-duration="4" data-track-index="3">
        <div class="pane">
          <div class="line xl" id="c1" style="top:420px">تابع —<br>بنفكّك <span class="amber">نوع فيديو</span> كل يوم.</div>
          <svg viewBox="0 0 1080 1920">
            <circle id="c2" class="nd fill" cx="540" cy="1120" r="150"/>
            <path id="c3" class="ar" d="M 470 1120 L 520 1175 L 620 1065"/>
          </svg>
          <div class="name" id="c4">video-production</div>
        </div>
      </section>

      <audio id="bgm" src="assets/music/bed.mp3" data-start="0" data-duration="18"
             data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;

/* draw a stroked path on, rather than fading it in — a diagram that appears
 * whole was never drawn, and the drawing is the point of this form */
function drawable(sel) {
  document.querySelectorAll(sel).forEach((el) => {
    const len = el.getTotalLength ? el.getTotalLength() : 1200;
    el.style.strokeDasharray = len; el.style.strokeDashoffset = len;
    el.dataset.len = len;
  });
}

function build() {
  // faint ruling, so the white reads as paper rather than as emptiness
  document.querySelectorAll(".pane").forEach((p) => {
    for (let y = 300; y < 1700; y += 94) {
      const r = document.createElement("div");
      r.className = "rule"; r.style.top = y + "px"; p.insertBefore(r, p.firstChild);
    }
  });

  drawable("#c3, #a6, #b4");
  // initial state OUTSIDE the timeline — tl.set(…,0) does not apply at frame 0
  gsap.set(["#h1","#h3","#a1","#a2","#a3","#a8","#a9","#a10","#b1","#b6","#b7","#b8",
            "#c1","#c4"], { opacity: 0 });
  gsap.set(["#h1","#a1","#b1","#c1"], { y: 24 });
  gsap.set(["#h2","#a4","#a5","#b2","#b3","#c2"], { opacity: 0, scale: 0.6,
            transformOrigin: "center", svgOrigin: "540 1120" });
  gsap.set(["#a7","#b5"], { opacity: 0 });
  gsap.set(".rule", { opacity: 0 });

  const tl = gsap.timeline({ paused: true });
  const rise = { opacity: 1, y: 0, ease: "power2.out" };
  const draw = { strokeDashoffset: 0, ease: "power2.inOut" };

  /* ── HOOK · 0–90 — one node drawn, then the claim ───────────────── */
  tl.to(".rule", { opacity: 1, duration: F(6) }, F(0));
  tl.to("#h2", { opacity: 1, scale: 1, duration: F(12), ease: "back.out(1.6)" }, F(0));
  tl.to("#h1", { ...rise, duration: F(14) }, F(4));
  tl.to("#h3", { opacity: 1, duration: F(10) }, F(16));

  /* ── VALUE · 90–270 — the two nodes and the arrow between them ──── */
  tl.to("#a1", { ...rise, duration: F(14) }, F(96));
  tl.to("#a2", { opacity: 1, duration: F(12) }, F(134));
  tl.to("#a4", { opacity: 1, scale: 1, duration: F(11), ease: "back.out(1.5)" }, F(140));
  tl.to("#a8", { opacity: 1, duration: F(8) }, F(150));
  tl.to("#a3", { opacity: 1, duration: F(12) }, F(166));
  tl.to("#a5", { opacity: 1, scale: 1, duration: F(11), ease: "back.out(1.5)" }, F(172));
  tl.to("#a9", { opacity: 1, duration: F(8) }, F(182));
  tl.to("#a6", { ...draw, duration: F(13) }, F(184));
  tl.to("#a7", { opacity: 1, duration: F(4) }, F(197));
  tl.to("#a10", { opacity: 1, duration: F(12) }, F(202));

  /* ── VALUE · 270–420 — two numbers that disagree ────────────────── */
  tl.to("#b1", { ...rise, duration: F(14) }, F(276));
  tl.to(["#b2","#b3"], { opacity: 1, scale: 1, duration: F(10), stagger: F(6),
                         ease: "back.out(1.5)" }, F(300));
  tl.to("#b6", { opacity: 1, duration: F(8) }, F(314));
  tl.to("#b7", { opacity: 1, duration: F(8) }, F(324));
  tl.to("#b4", { ...draw, duration: F(12) }, F(334));
  tl.to("#b5", { opacity: 1, duration: F(4) }, F(346));
  tl.to("#b8", { opacity: 1, duration: F(12) }, F(356));

  /* ── CTA · 420–540 — the tick is drawn, not stamped ─────────────── */
  tl.to("#c1", { ...rise, duration: F(16) }, F(426));
  tl.to("#c2", { opacity: 1, scale: 1, duration: F(11), ease: "back.out(1.6)" }, F(440));
  tl.to("#c3", { ...draw, duration: F(14) }, F(452));
  tl.to("#c4", { opacity: 1, duration: F(12) }, F(466));

  /* ── music — one continuous track, gain automation only (#26 #27) ─ */
  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.40, duration: 0.9, ease: "none",
            immediateRender: false }, 0);
  tl.to("#bgm", { volume: 0.29, duration: F(8), ease: "none" }, F(270));
  tl.to("#bgm", { volume: 0.40, duration: F(18), ease: "none" }, F(310));
  tl.to("#bgm", { volume: 0, duration: 1.3, ease: "none" }, F(501));

  const t = (id, ch, fr, still, text, crit) =>
    mf(id, { type: "text", chapter: ch, frames: fr, still_from: still, text: text,
             critical: crit !== false, el: "#" + id });
  const sh = (id, ch, fr, still) =>
    mf(id, { type: "shape", chapter: ch, frames: fr, still_from: still,
             critical: false, el: "#" + id });

  t("h1","ch1",[0,90],18,"الفيديو بيقدر يراجع نفسه.");
  sh("h2","ch1",[0,90],12);
  t("h3","ch1",[0,90],26,"فيديو",false);

  t("a1","ch2",[90,270],110,"المراجعة البشرية بتفوّت اللي اتعوّدت عليه.");
  t("a2","ch2",[90,270],146,"التركيب بيكتب مكان كل عنصر.");
  t("a3","ch2",[90,270],178,"وبرنامج تاني بيقيس الفعلي.");
  sh("a4","ch2",[90,270],151); sh("a5","ch2",[90,270],183);
  t("a8","ch2",[90,270],158,"المُعلَن",false);
  t("a9","ch2",[90,270],190,"المقيس",false);
  sh("a6","ch2",[90,270],197);
  t("a10","ch2",[90,270],214,"لو الاتنين مختلفين، في غلطة.");

  t("b1","ch3",[270,420],290,"الاتنين متفقين؟ يعدّي. مختلفين؟ يقف.");
  sh("b2","ch3",[270,420],316);
  t("b6","ch3",[270,420],322,"",false);
  t("b7","ch3",[270,420],332,"",false);
  sh("b4","ch3",[270,420],346);
  t("b8","ch3",[270,420],368,"التسليم بيقف لحد ما تتصلّح.");

  t("c1","ch4",[420,540],442,"تابع — بنفكّك نوع فيديو كل يوم.");
  sh("c2","ch4",[420,540],451); sh("c3","ch4",[420,540],466);
  t("c4","ch4",[420,540],478,"",false);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
