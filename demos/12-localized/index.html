<!doctype html>
<!--
  Demo 12 — localization.  v2.

  v1 drew twin language columns and a growth bar — a diagram of the problem.
  v2 plays the answer: the motion-graphics film in Arabic and in English, side
  by side and in sync. The English was built from the SAME timeline as the
  Arabic (demos/_src/motion-graphics) with its strings swapped and its frame
  mirrored: the words start from the left, and the steps climb left to right.

  Its strings were measured against the Arabic with scripts/localize.mjs
  (length-check.txt): up to 38% longer, so the English is set smaller and its
  longest line takes three lines. Then the full verifier ran on it again, with
  the language check reversed — no Arabic word may reach the English cut.

  Needs both renders in media/ — see demos/README.md.

  Cold-read ledger (script.json):
    ch1 0-65      establishes  one video in two languages
    ch2 65-196    needs ch1 · establishes a tool translates AND re-lays it; translation alone breaks the design
    ch3 196-262   needs ch2 · establishes the direction flips
    ch4 262-393   needs ch3 · establishes the shapes flip too   (the steps build on screen here)
    claim 393-458 needs ch4 · establishes it is whole in both languages
    cta 458-540   needs claim
-->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>نفس الفيديو بلغتين</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); background:var(--ink); }
      .scene { position:absolute; inset:0; }

      /* the original on the right, where Arabic starts; the English on the left */
      .tile { position:absolute; top:470px; width:470px; height:836px; border-radius:16px;
              object-fit:cover; background:var(--bone); }
      #v-ar { left:570px; } #v-en { left:40px; }
      .ring { position:absolute; top:462px; width:486px; height:852px; border-radius:22px;
              border:6px solid rgba(245,242,234,.22); }
      #r-ar { left:562px; } #r-en { left:32px; }

      .lab { position:absolute; top:1334px; width:470px; font-size:34px; font-weight:700;
             color:rgba(245,242,234,.72); direction:rtl; text-align:right; line-height:1.2; }
      .lab b { color:var(--amber); font-weight:800; }
      #l-ar { left:570px; } #l-en { left:40px; }

      .cap { position:absolute; right:88px; top:250px; width:904px; height:160px;
             display:flex; flex-direction:column; justify-content:center; visibility:hidden; }
      .cap .t { direction:rtl; text-align:right; font-size:58px; font-weight:800; line-height:1.3;
                letter-spacing:-.01em; text-wrap:balance; }
      .cap .x { color:var(--amber); }
      .cap .tag { margin-top:10px; font-family:"Mono",monospace; font-size:30px; font-weight:700;
                  letter-spacing:.1em; color:var(--amber); direction:ltr; text-align:right; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-fps="30" data-width="1080" data-height="1920">
      <video id="v-ar" class="clip tile" src="media/arabic.mp4" muted playsinline
             data-start="0" data-duration="18" data-track-index="1"></video>
      <video id="v-en" class="clip tile" src="media/english.mp4" muted playsinline
             data-start="0" data-duration="18" data-track-index="2"></video>

      <section id="board" class="scene clip" data-start="0" data-duration="18" data-track-index="0">
        <div class="ring" id="r-ar"></div><div class="ring" id="r-en"></div>
        <div class="lab" id="l-ar">عربي · الأصل</div>
        <div class="lab" id="l-en">إنجليزي · <b>أطول لحد ٣٨٪</b></div>

        <div class="cap" id="k1"><div class="t">نفس الفيديو، <span class="x">بلغتين.</span></div></div>
        <div class="cap" id="k2"><div class="t">أداة بتعمل الفيديو، وبتترجمه <span class="x">وتعيد ترتيبه للغة التانية.</span></div></div>
        <div class="cap" id="k3"><div class="t">الكلام بيبدأ <span class="x">من الشمال،</span></div></div>
        <div class="cap" id="k4"><div class="t">والدرجات بتطلع <span class="x">من الشمال لليمين،</span></div></div>
        <div class="cap" id="k5"><div class="t">وكل سطر <span class="x">اتقاس من جديد.</span></div></div>
        <div class="cap" id="k6"><div class="t">تابع — <span class="x">نوع جديد بكرة.</span></div>
          <div class="tag">video-production</div></div>
      </section>

      <!-- both cuts share one timeline, so they share one mix -->
      <audio id="mix" src="media/arabic.mp4" data-start="0" data-duration="18"
             data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;
const END = 540;

const CH = [["k1", 0, 65], ["k2", 65, 196], ["k3", 196, 262], ["k4", 262, 393],
            ["k5", 393, 458], ["k6", 458, 540]];
const TEXT = ["نفس الفيديو، بلغتين.", "أداة بتعمل الفيديو، وبتترجمه وتعيد ترتيبه للغة التانية.",
              "الكلام بيبدأ من الشمال،", "والدرجات بتطلع من الشمال لليمين،",
              "وكل سطر اتقاس من جديد.", "تابع — نوع جديد بكرة. video-production"];
/* the English lights while its changes are named; both at the claim */
const DIM = "rgba(245,242,234,.22)", LIT = "#F5F2EA", ON = "#C77B0E";
const LIGHT = [
  { ar: LIT, en: LIT }, { ar: LIT, en: LIT }, { ar: DIM, en: ON },
  { ar: DIM, en: ON },  { ar: ON, en: ON },   { ar: LIT, en: LIT },
];

function build() {
  const tl = gsap.timeline({ paused: true });
  // a tl.set at 0 does not apply on frame 0; frame-0 state goes through gsap.set
  const put = (at, sel, v) => (at === 0 ? gsap.set(sel, v) : tl.set(sel, v, F(at)));

  CH.forEach(([id, s, e], i) => {
    put(s, "#" + id, { visibility: "visible" });
    if (e < END) tl.set("#" + id, { visibility: "hidden" }, F(e));
    ["ar", "en"].forEach((r) => put(s, "#r-" + r, { borderColor: LIGHT[i][r] }));
  });

  /* the mix is the film's own, already normalised — a short fade at each end only */
  tl.fromTo("#mix", { volume: 0 }, { volume: 1, duration: F(3), ease: "none",
            immediateRender: false }, 0);
  tl.to("#mix", { volume: 0, duration: F(24), ease: "none" }, F(END - 24));

  CH.forEach(([id, s, e], i) =>
    mf(id, { type: "text", chapter: "board", frames: [s, e], still_from: s + 2,
             text: TEXT[i], critical: true, el: "#" + id }));
  [["l-ar", "عربي · الأصل"], ["l-en", "إنجليزي · أطول لحد ٣٨٪"]].forEach(([id, t]) =>
    mf(id, { type: "text", chapter: "board", frames: [0, END], still_from: 0,
             text: t, critical: true, el: "#" + id }));
  // the English tile is a declared foreign-language region: its words are the
  // English cut's, verified there with the language check reversed
  ["ar", "en"].forEach((r) => {
    mf("v-" + r, { type: "video", chapter: "board", frames: [0, END], still_from: 0,
                   critical: false, el: "#v-" + r });
    mf("r-" + r, { type: "shape", chapter: "board", frames: [0, END], still_from: 0,
                   critical: false, el: "#r-" + r });
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
