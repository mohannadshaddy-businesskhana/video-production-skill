<!doctype html>
<!-- Demo 04 — section series.  A template you can SEE: a fixed rail, a grid of
     episodes, and one frame whose contents swap while nothing else moves.
     HOOK 0–3 · VALUE 3–14 · CTA 14–18 -->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ثمنتاشر فيديو شكل واحد</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; --pass-lt:#5E8F78; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); background:var(--ink); }
      .scene { position:absolute; inset:0; overflow:hidden; background:var(--ink); }
      .pane  { position:absolute; inset:0; direction:rtl; }
      .line  { position:absolute; right:88px; width:904px; font-weight:600;
               line-height:1.36; letter-spacing:-.01em; }
      .xl { font-size:96px; } .lg { font-size:66px; } .md { font-size:50px; }
      .amber { color:var(--amber); }

      /* the rail — the one element that never moves across the whole series */
      .rail { position:absolute; right:88px; top:250px; width:904px; height:74px;
              border-bottom:4px solid rgba(245,242,234,.28);
              display:flex; flex-direction:row-reverse; align-items:center; gap:20px; }
      .rail .dot { width:22px; height:22px; border-radius:50%; background:var(--amber); }
      .rail .ttl { font-family:"Mono",monospace; font-size:28px; letter-spacing:.14em;
                   color:rgba(245,242,234,.7); font-weight:700; }
      .rail .ep  { margin-right:auto; font-family:"Mono",monospace; font-size:28px;
                   color:var(--amber); font-weight:700; }

      /* 18 cells filling in */
      .grid { position:absolute; right:88px; top:900px; width:904px;
              display:grid; grid-template-columns:repeat(6,1fr); gap:18px; }
      .cell { aspect-ratio:9/16; border:4px solid rgba(245,242,234,.35); border-radius:6px;
              background:rgba(245,242,234,.05); position:relative; }
      .cell::after { content:""; position:absolute; left:18%; right:18%; top:26%;
                     height:8px; background:var(--amber); border-radius:4px; }
      .cell::before { content:""; position:absolute; left:18%; right:44%; top:44%;
                      height:8px; background:rgba(245,242,234,.4); border-radius:4px; }

      /* three episodes, identical chrome */
      .eps { position:absolute; right:88px; top:640px; width:904px; display:flex;
             flex-direction:row-reverse; gap:24px; }
      .ep  { flex:1; height:470px; border:4px solid rgba(245,242,234,.3); border-radius:8px;
             background:rgba(245,242,234,.04); padding:20px; position:relative; }
      .ep .hd { height:44px; border-bottom:3px solid rgba(245,242,234,.3); display:flex;
                flex-direction:row-reverse; align-items:center; gap:12px; }
      .ep .hd i { width:14px; height:14px; border-radius:50%; background:var(--amber); display:block; }
      .ep .hd b { font-family:"Mono",monospace; font-size:18px; color:rgba(245,242,234,.65); }
      .ep .bd { margin-top:26px; }
      .ep .bd u { display:block; height:14px; border-radius:7px; margin-bottom:16px;
                  background:rgba(245,242,234,.22); text-decoration:none; }
      .ep .bd u.a { width:88%; } .ep .bd u.b { width:64%; } .ep .bd u.c { width:76%; }
      .ep .no { position:absolute; left:20px; bottom:16px; font-family:"Mono",monospace;
                font-size:22px; color:var(--amber); font-weight:700; }

      /* one frame, contents swapping */
      .slot { position:absolute; right:88px; top:760px; width:904px; height:560px;
              border:5px solid var(--bone); border-radius:10px; overflow:hidden;
              background:rgba(245,242,234,.05); }
      .slot .hd { height:70px; border-bottom:4px solid rgba(245,242,234,.3);
                  display:flex; flex-direction:row-reverse; align-items:center;
                  gap:16px; padding:0 26px; }
      .slot .hd i { width:20px; height:20px; border-radius:50%; background:var(--amber); }
      .slot .hd b { font-family:"Mono",monospace; font-size:24px; color:rgba(245,242,234,.7); }
      .swap { position:absolute; left:0; right:0; top:70px; bottom:0; padding:44px 34px; }
      .swap u { display:block; height:24px; border-radius:12px; margin-bottom:26px;
                background:var(--amber); text-decoration:none; }
      .swap u.q { background:rgba(245,242,234,.3); }

      .name { position:absolute; right:88px; top:1500px; width:904px;
              font-family:"Mono",monospace; font-size:40px; letter-spacing:.06em;
              color:var(--amber); direction:ltr; text-align:right; font-weight:700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-fps="30" data-width="1080" data-height="1920">

      <section id="ch1" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="pane">
          <div class="line xl" id="h1" style="top:400px">ثمنتاشر فيديو.<br><span class="amber">شكل واحد.</span></div>
          <div class="grid" id="h2"></div>
        </div>
      </section>

      <section id="ch2" class="scene clip" data-start="3" data-duration="6" data-track-index="1">
        <div class="pane">
          <div class="rail" id="a0"><span class="dot"></span><span class="ttl">SERIES</span><span class="ep">03 / 18</span></div>
          <div class="line lg" id="a1" style="top:380px">لما كل فيديو يتعمل لوحده،<br>السلسلة بتبان مفكّكة.</div>
          <div class="eps" id="a2">
            <div class="ep"><div class="hd"><i></i><b>SERIES</b></div>
              <div class="bd"><u class="a"></u><u class="b"></u><u class="c"></u></div><div class="no">01</div></div>
            <div class="ep"><div class="hd"><i></i><b>SERIES</b></div>
              <div class="bd"><u class="b"></u><u class="a"></u><u class="c"></u></div><div class="no">02</div></div>
            <div class="ep"><div class="hd"><i></i><b>SERIES</b></div>
              <div class="bd"><u class="c"></u><u class="b"></u><u class="a"></u></div><div class="no">03</div></div>
          </div>
          <div class="line md" id="a3" style="top:1300px">القالب بيثبّت الشكل والإيقاع.</div>
        </div>
      </section>

      <section id="ch3" class="scene clip" data-start="9" data-duration="5" data-track-index="2">
        <div class="pane">
          <div class="rail" id="b0"><span class="dot"></span><span class="ttl">SERIES</span><span class="ep">04 / 18</span></div>
          <div class="line lg" id="b1" style="top:400px">المحتوى بيتغيّر.<br>الزمن والشكل لأ.</div>
          <div class="slot" id="b2">
            <div class="hd"><i></i><b>SERIES</b></div>
            <div class="swap" id="b3"><u style="width:86%"></u><u class="q" style="width:58%"></u><u style="width:72%"></u></div>
          </div>
          <div class="line md" id="b4" style="top:1400px">فالحلقة الجديدة بتاخد دقايق.</div>
        </div>
      </section>

      <section id="ch4" class="scene clip" data-start="14" data-duration="4" data-track-index="3">
        <div class="pane">
          <div class="rail" id="c0"><span class="dot"></span><span class="ttl">SERIES</span><span class="ep">05 / 18</span></div>
          <div class="line xl" id="c1" style="top:520px">تابع —<br>الحلقة الجاية <span class="amber">بكرة</span>.</div>
          <div class="grid" id="c2" style="top:1000px"></div>
          <div class="name" id="c3">video-production</div>
        </div>
      </section>

      <audio id="bgm" src="assets/music/bed.mp3" data-start="0" data-duration="18"
             data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;

function build() {
  for (const gid of ["h2", "c2"]) {
    const g = document.getElementById(gid);
    for (let i = 0; i < 18; i++) {
      const d = document.createElement("div"); d.className = "cell"; g.appendChild(d);
    }
  }

  // initial state OUTSIDE the timeline — tl.set(…,0) does not apply at frame 0
  gsap.set(["#h1","#a0","#a1","#a2","#a3","#b0","#b1","#b2","#b4","#c0","#c1","#c2","#c3"],
           { opacity: 0 });
  gsap.set(["#h1","#a1","#b1","#c1"], { y: 24 });
  gsap.set("#h2 .cell", { opacity: 0, scale: 0.7, transformOrigin: "center" });
  gsap.set("#c2 .cell", { opacity: 0 });
  gsap.set(".ep", { opacity: 0, y: 22 });
  gsap.set("#b3 u", { scaleX: 0, transformOrigin: "right center" });

  const tl = gsap.timeline({ paused: true });
  const rise = { opacity: 1, y: 0, ease: "power2.out" };

  /* ── HOOK · 0–90 — eighteen cells arriving is the claim ─────────── */
  tl.to("#h2", { opacity: 1, duration: F(2) }, F(0));
  tl.to("#h2 .cell", { opacity: 1, scale: 1, duration: F(5), stagger: F(1.6),
                       ease: "back.out(1.5)" }, F(0));
  tl.to("#h1", { ...rise, duration: F(14) }, F(4));

  /* ── VALUE · 90–270 — three episodes wearing the same chrome ────── */
  tl.to("#a0", { opacity: 1, duration: F(10) }, F(94));
  tl.to("#a1", { ...rise, duration: F(14) }, F(96));
  tl.to("#a2", { opacity: 1, duration: F(2) }, F(140));
  tl.to(".ep", { opacity: 1, y: 0, duration: F(11), stagger: F(10),
                 ease: "power2.out" }, F(140));
  tl.to("#a3", { opacity: 1, duration: F(14) }, F(190));

  /* ── VALUE · 270–420 — one frame, contents swapping inside it ───── */
  tl.to("#b0", { opacity: 1, duration: F(10) }, F(274));
  tl.to("#b1", { ...rise, duration: F(14) }, F(276));
  tl.to("#b2", { opacity: 1, duration: F(10) }, F(300));
  tl.to("#b3 u", { scaleX: 1, duration: F(9), stagger: F(8), ease: "power2.out" }, F(312));
  tl.to("#b4", { opacity: 1, duration: F(14) }, F(352));

  /* ── CTA · 420–540 ──────────────────────────────────────────────── */
  tl.to("#c0", { opacity: 1, duration: F(10) }, F(424));
  tl.to("#c1", { ...rise, duration: F(16) }, F(426));
  tl.to("#c2", { opacity: 1, duration: F(2) }, F(442));
  tl.to("#c2 .cell", { opacity: 1, duration: F(4), stagger: F(1.2) }, F(442));
  tl.to("#c3", { opacity: 1, duration: F(12) }, F(466));

  /* ── music — one continuous track, gain automation only (#26 #27) ─ */
  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.40, duration: 0.9, ease: "none",
            immediateRender: false }, 0);
  tl.to("#bgm", { volume: 0.29, duration: F(8), ease: "none" }, F(270));
  tl.to("#bgm", { volume: 0.40, duration: F(18), ease: "none" }, F(310));
  tl.to("#bgm", { volume: 0, duration: 1.3, ease: "none" }, F(501));

  const t = (id, ch, fr, still, text, crit) =>
    mf(id, { type: "text", chapter: ch, frames: fr, still_from: still, text: text,
             critical: crit !== false, el: "#" + id });
  const sh = (id, ch, fr, still) =>
    mf(id, { type: "shape", chapter: ch, frames: fr, still_from: still,
             critical: false, el: "#" + id });

  t("h1","ch1",[0,90],18,"ثمنتاشر فيديو. شكل واحد.");
  sh("h2","ch1",[0,90],34);

  t("a0","ch2",[90,270],104,"",false);
  t("a1","ch2",[90,270],110,"لما كل فيديو يتعمل لوحده، السلسلة بتبان مفكّكة.");
  sh("a2","ch2",[90,270],171);
  t("a3","ch2",[90,270],204,"القالب بيثبّت الشكل والإيقاع.");

  t("b0","ch3",[270,420],284,"",false);
  t("b1","ch3",[270,420],290,"المحتوى بيتغيّر. الزمن والشكل لأ.");
  sh("b2","ch3",[270,420],337);
  t("b4","ch3",[270,420],366,"فالحلقة الجديدة بتاخد دقايق.");

  t("c0","ch4",[420,540],434,"",false);
  t("c1","ch4",[420,540],442,"تابع — الحلقة الجاية بكرة.");
  sh("c2","ch4",[420,540],466);
  t("c3","ch4",[420,540],478,"",false);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
