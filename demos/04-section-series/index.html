<!doctype html>
<!--
  Demo 04 — series.  v2.

  v1 drew a template — a rail, a grid, a frame whose contents swapped: a
  picture of the idea. v2 plays three real episodes of one series, "نوع
  النهارده", side by side. Each was generated from ONE template and one row of
  data (demos/_src/series), and each passed the gate as a six-second bumper and
  the full verifier on its own. Because they share the template's clock, at
  every moment all three stand at the same point of it — badge and type, then
  the line, then tomorrow's teaser — with different content. The template is
  what the eye sees without being told.

  Each episode's sample is a real excerpt of that type's own demo.
  Needs the three episode renders in media/ — see demos/README.md.

  Cold-read ledger (script.json):
    ch1 0-65      establishes  three episodes, one template
    ch2 65-196    needs ch1 · establishes a tool builds the series from a template; one-offs break a series
    ch3 196-262   needs ch2 · establishes the look is fixed
    ch4 262-393   needs ch3 · establishes only the content changes
    claim 393-458 needs ch4 · establishes a new episode is quick
    cta 458-540   needs claim
-->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>نفس القالب، تلات حلقات</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); background:var(--ink); }
      .scene { position:absolute; inset:0; }

      /* episode one on the right, where Arabic starts */
      .tile { position:absolute; top:540px; width:340px; height:604px; border-radius:16px;
              object-fit:cover; background:var(--ink); }
      .t1 { left:725px; } .t2 { left:370px; } .t3 { left:15px; }
      .ring { position:absolute; top:532px; width:356px; height:620px; border-radius:22px;
              border:6px solid rgba(245,242,234,.22); }
      #r1 { left:717px; } #r2 { left:362px; } #r3 { left:7px; }

      .lab { position:absolute; top:1180px; width:340px; text-align:center; direction:rtl;
             font-size:40px; font-weight:800; line-height:1.3; color:rgba(245,242,234,.72); }
      .lab b { color:var(--amber); }
      #l1 { left:725px; } #l2 { left:370px; } #l3 { left:15px; }

      .cap { position:absolute; right:88px; top:250px; width:904px; height:160px;
             display:flex; flex-direction:column; justify-content:center; visibility:hidden; }
      .cap .t { direction:rtl; text-align:right; font-size:58px; font-weight:800; line-height:1.3;
                letter-spacing:-.01em; text-wrap:balance; }
      .cap .x { color:var(--amber); }
      .cap .tag { margin-top:10px; font-family:"Mono",monospace; font-size:30px; font-weight:700;
                  letter-spacing:.1em; color:var(--amber); direction:ltr; text-align:right; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-fps="30" data-width="1080" data-height="1920">
      <!-- three runs of each six-second episode, all three in step -->
      <video id="v1a" class="clip tile t1" src="media/ep1.mp4" muted playsinline data-start="0"  data-duration="6" data-track-index="1"></video>
      <video id="v1b" class="clip tile t1" src="media/ep1.mp4" muted playsinline data-start="6"  data-duration="6" data-track-index="2"></video>
      <video id="v1c" class="clip tile t1" src="media/ep1.mp4" muted playsinline data-start="12" data-duration="6" data-track-index="3"></video>
      <video id="v2a" class="clip tile t2" src="media/ep2.mp4" muted playsinline data-start="0"  data-duration="6" data-track-index="4"></video>
      <video id="v2b" class="clip tile t2" src="media/ep2.mp4" muted playsinline data-start="6"  data-duration="6" data-track-index="5"></video>
      <video id="v2c" class="clip tile t2" src="media/ep2.mp4" muted playsinline data-start="12" data-duration="6" data-track-index="6"></video>
      <video id="v3a" class="clip tile t3" src="media/ep3.mp4" muted playsinline data-start="0"  data-duration="6" data-track-index="7"></video>
      <video id="v3b" class="clip tile t3" src="media/ep3.mp4" muted playsinline data-start="6"  data-duration="6" data-track-index="8"></video>
      <video id="v3c" class="clip tile t3" src="media/ep3.mp4" muted playsinline data-start="12" data-duration="6" data-track-index="9"></video>

      <section id="board" class="scene clip" data-start="0" data-duration="18" data-track-index="0">
        <div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="ring" id="r3"></div>
        <div class="lab" id="l1">الحلقة <b>١</b></div>
        <div class="lab" id="l2">الحلقة <b>٢</b></div>
        <div class="lab" id="l3">الحلقة <b>٣</b></div>

        <div class="cap" id="k1"><div class="t">نفس القالب، <span class="x">تلات حلقات.</span></div></div>
        <div class="cap" id="k2"><div class="t">أداة بتعمل الفيديو، وبتطلّع الحلقات كلها <span class="x">من قالب واحد.</span></div></div>
        <div class="cap" id="k3"><div class="t"><span class="x">الشكل والتوقيت</span> ثابتين،</div></div>
        <div class="cap" id="k4"><div class="t">و<span class="x">المحتوى بس</span> اللي بيتغيّر،</div></div>
        <div class="cap" id="k5"><div class="t">فالحلقة الجديدة <span class="x">بتاخد دقايق.</span></div></div>
        <div class="cap" id="k6"><div class="t">تابع — <span class="x">نوع جديد بكرة.</span></div>
          <div class="tag">video-production</div></div>
      </section>

      <!-- the series sounds the same in every episode, so one episode's mix serves all three -->
      <audio id="mixa" src="media/ep1.mp4" data-start="0"  data-duration="6" data-track-index="10" data-volume="1"></audio>
      <audio id="mixb" src="media/ep1.mp4" data-start="6"  data-duration="6" data-track-index="11" data-volume="1"></audio>
      <audio id="mixc" src="media/ep1.mp4" data-start="12" data-duration="6" data-track-index="12" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;
const END = 540;

const CH = [["k1", 0, 65], ["k2", 65, 196], ["k3", 196, 262], ["k4", 262, 393],
            ["k5", 393, 458], ["k6", 458, 540]];
const TEXT = ["نفس القالب، تلات حلقات.", "أداة بتعمل الفيديو، وبتطلّع الحلقات كلها من قالب واحد.",
              "الشكل والتوقيت ثابتين،", "والمحتوى بس اللي بيتغيّر،", "فالحلقة الجديدة بتاخد دقايق.",
              "تابع — نوع جديد بكرة. video-production"];
/* the frames light together — the point is that the three are the same */
const DIM = "rgba(245,242,234,.22)", LIT = "#F5F2EA", ON = "#C77B0E";
const LIGHT = [LIT, LIT, ON, ON, LIT, LIT];

function build() {
  const tl = gsap.timeline({ paused: true });
  // a tl.set at 0 does not apply on frame 0; frame-0 state goes through gsap.set
  const put = (at, sel, v) => (at === 0 ? gsap.set(sel, v) : tl.set(sel, v, F(at)));

  CH.forEach(([id, s, e], i) => {
    put(s, "#" + id, { visibility: "visible" });
    if (e < END) tl.set("#" + id, { visibility: "hidden" }, F(e));
    ["#r1", "#r2", "#r3"].forEach((r) => put(s, r, { borderColor: LIGHT[i] }));
  });

  CH.forEach(([id, s, e], i) =>
    mf(id, { type: "text", chapter: "board", frames: [s, e], still_from: s + 2,
             text: TEXT[i], critical: true, el: "#" + id }));
  [1, 2, 3].forEach((n) => {
    mf("l" + n, { type: "text", chapter: "board", frames: [0, END], still_from: 0,
                  text: "الحلقة " + "٠١٢٣"[n], critical: true, el: "#l" + n });
    mf("v" + n, { type: "video", chapter: "board", frames: [0, END], still_from: 0,
                  critical: false, el: `#v${n}a` });
    mf("r" + n, { type: "shape", chapter: "board", frames: [0, END], still_from: 0,
                  critical: false, el: "#r" + n });
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
