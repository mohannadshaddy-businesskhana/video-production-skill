<!doctype html>
<!--
  Demo 01 — brand film
  One claim, said slowly. The form IS the argument: a brand film earns its
  weight by refusing to list things.
-->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>يتسلّم لما يثبت</title>

    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }

      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; }

      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); }
      .scene { position:absolute; inset:0; overflow:hidden; }
      .pane  { position:absolute; inset:0; direction:rtl; }

      /* the safe band, 230 → 1690, is where every critical element lives */
      .eyebrow { position:absolute; right:88px; top:250px; font-family:"Mono",monospace;
                 font-size:26px; letter-spacing:.18em; color:var(--amber);
                 direction:ltr; text-align:right; font-weight:700; }
      .rule    { position:absolute; right:88px; top:316px; width:904px; height:2px;
                 background:rgba(245,242,234,.22); transform-origin:right center; }
      .claim   { position:absolute; right:88px; width:904px; font-weight:600;
                 font-size:104px; line-height:1.34; letter-spacing:-.01em; }
      .foot    { position:absolute; right:88px; top:1590px; width:904px;
                 font-family:"Mono",monospace; font-size:28px; letter-spacing:.1em;
                 color:rgba(245,242,234,.5); direction:ltr; text-align:right; font-weight:700; }

      .bone-scene { background:var(--bone); }
      .bone-scene .claim, .bone-scene .eyebrow { color:var(--ink); }
      .bone-scene .rule  { background:rgba(20,24,31,.18); }
      /* .45 measured 2.86:1 on the bone ground — under the 3:1 floor for this
         size. .62 clears it and still reads as secondary. */
      .bone-scene .foot  { color:rgba(20,24,31,.62); }

      .accent { color:var(--amber); }

      /* the report — the one moment the film shows its evidence */
      .report { position:absolute; right:88px; top:640px; width:904px;
                font-family:"Mono",monospace; font-size:34px; line-height:2.05;
                direction:ltr; text-align:left; font-weight:700; }
      .report .row { display:flex; gap:20px; white-space:nowrap; }
      .report .nm  { color:rgba(20,24,31,.55); width:470px; }
      .report .ok  { color:var(--pass); }
      .report .bad { color:var(--fail); }
      .verdict { position:absolute; right:88px; top:1330px; width:904px;
                 font-family:"Mono",monospace; font-size:44px; font-weight:700;
                 color:var(--fail); direction:ltr; text-align:left; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-fps="30" data-width="1080" data-height="1920">

      <!-- 1 — the ordinary truth -->
      <section id="ch1" class="scene clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="pane">
          <div class="eyebrow" id="c1-eye">VIDEO&nbsp;/&nbsp;001</div>
          <div class="rule" id="c1-rule"></div>
          <div class="claim" id="c1-claim" style="top:700px">كل أداة<br>بتعرف تعمل فيديو.</div>
          <div class="foot" id="c1-foot">ANY TOOL CAN RENDER</div>
        </div>
      </section>

      <!-- 2 — the turn -->
      <section id="ch2" class="scene clip" data-start="5" data-duration="5" data-track-index="1">
        <div class="pane">
          <div class="eyebrow" id="c2-eye">VIDEO&nbsp;/&nbsp;002</div>
          <div class="rule" id="c2-rule"></div>
          <div class="claim" id="c2-claim" style="top:700px">دي بتعرف<br><span class="accent">ترفضه.</span></div>
          <div class="foot" id="c2-foot">THIS ONE REFUSES IT</div>
        </div>
      </section>

      <!-- 3 — the evidence, on the inverted ground -->
      <section id="ch3" class="scene clip bone-scene" data-start="10" data-duration="5" data-track-index="2">
        <div class="pane">
          <div class="eyebrow" id="c3-eye">VERIFY</div>
          <div class="rule" id="c3-rule"></div>
          <div class="report" id="c3-report">
            <div class="row"><span class="nm">loudness</span><span class="ok">ok</span></div>
            <div class="row"><span class="nm">palette</span><span class="ok">ok</span></div>
            <div class="row"><span class="nm">reading dwell</span><span class="ok">ok</span></div>
            <div class="row"><span class="nm">content coverage</span><span class="bad">FAIL</span></div>
          </div>
          <div class="verdict" id="c3-verdict">1 CHECK FAILED — NOT DELIVERED</div>
          <div class="foot" id="c3-foot">EXIT 1</div>
        </div>
      </section>

      <!-- 4 — the claim -->
      <section id="ch4" class="scene clip" data-start="15" data-duration="3" data-track-index="3">
        <div class="pane">
          <div class="eyebrow" id="c4-eye">video-production</div>
          <div class="rule" id="c4-rule"></div>
          <div class="claim" id="c4-claim" style="top:760px">الفيديو ما بيتسلّمش<br>غير لما <span class="accent">يثبت</span> إنه صح.</div>
          <div class="foot" id="c4-foot">APACHE-2.0 · NOTHING TO INSTALL</div>
        </div>
      </section>

      <audio id="bgm" src="assets/music/bed.mp3" data-start="0" data-duration="18"
             data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;

function build() {
  /* Every initial state is set OUTSIDE the timeline. tl.set(…, 0) does not
   * apply at frame 0 under a per-frame seek, so frame 0 would show the lot. */
  const hide = ["#c1-eye","#c1-claim","#c1-foot","#c2-eye","#c2-claim","#c2-foot",
                "#c3-eye","#c3-report","#c3-verdict","#c3-foot",
                "#c4-eye","#c4-claim","#c4-foot"];
  gsap.set(hide, { opacity: 0 });
  gsap.set(["#c1-claim","#c2-claim","#c4-claim"], { y: 26 });
  gsap.set(["#c1-rule","#c2-rule","#c3-rule","#c4-rule"], { scaleX: 0 });
  gsap.set("#c3-report .row", { opacity: 0, x: -18 });
  gsap.set("#c3-verdict", { opacity: 0 });

  const tl = gsap.timeline({ paused: true });

  /* ── chapter 1 · 0–150 ───────────────────────────────────────────── */
  tl.to("#c1-eye",   { opacity: 1, duration: F(12) }, F(6));
  tl.to("#c1-rule",  { scaleX: 1, duration: F(20), ease: "power2.out" }, F(10));
  tl.to("#c1-claim", { opacity: 1, y: 0, duration: F(22), ease: "power2.out" }, F(16));
  tl.to("#c1-foot",  { opacity: 1, duration: F(14) }, F(34));

  /* ── chapter 2 · 150–300 — the turn, so it arrives harder ────────── */
  tl.to("#c2-eye",   { opacity: 1, duration: F(10) }, F(156));
  tl.to("#c2-rule",  { scaleX: 1, duration: F(16), ease: "power2.out" }, F(158));
  tl.to("#c2-claim", { opacity: 1, y: 0, duration: F(18), ease: "power3.out" }, F(162));
  tl.to("#c2-foot",  { opacity: 1, duration: F(12) }, F(180));

  /* ── chapter 3 · 300–450 — the evidence ──────────────────────────── */
  tl.to("#c3-eye",  { opacity: 1, duration: F(10) }, F(304));
  tl.to("#c3-rule", { scaleX: 1, duration: F(16), ease: "power2.out" }, F(306));
  tl.to("#c3-report", { opacity: 1, duration: F(2) }, F(310));
  tl.to("#c3-report .row", { opacity: 1, x: 0, duration: F(10), stagger: F(9),
                             ease: "power2.out" }, F(310));
  tl.to("#c3-verdict", { opacity: 1, duration: F(10) }, F(356));
  tl.to("#c3-foot",    { opacity: 1, duration: F(10) }, F(366));

  /* ── chapter 4 · 450–540 — the claim ─────────────────────────────── */
  tl.to("#c4-eye",   { opacity: 1, duration: F(10) }, F(454));
  tl.to("#c4-rule",  { scaleX: 1, duration: F(16), ease: "power2.out" }, F(456));
  tl.to("#c4-claim", { opacity: 1, y: 0, duration: F(20), ease: "power2.out" }, F(460));
  tl.to("#c4-foot",  { opacity: 1, duration: F(12) }, F(472));

  /* ── music · one continuous track, gain automation only (#26 #27) ── */
  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.40, duration: 1.0, ease: "none",
            immediateRender: false }, 0);
  tl.to("#bgm", { volume: 0.30, duration: F(8), ease: "none" }, F(300));
  tl.to("#bgm", { volume: 0.40, duration: F(20), ease: "none" }, F(330));
  tl.to("#bgm", { volume: 0, duration: 1.4, ease: "none" }, F(498));

  /* ── the manifest: what this composition CLAIMS it drew ──────────── */
  const chap = (n, s, e, eyeAt, ruleAt, footAt) => {
    mf(`c${n}-eye`,   { type: "text", chapter: `ch${n}`, frames: [s, e],
                        still_from: eyeAt, text: "", critical: true, el: `#c${n}-eye` });
    mf(`c${n}-rule`,  { type: "shape", chapter: `ch${n}`, frames: [s, e],
                        still_from: ruleAt, critical: false, el: `#c${n}-rule` });
    mf(`c${n}-foot`,  { type: "text", chapter: `ch${n}`, frames: [s, e],
                        still_from: footAt, text: "", critical: true, el: `#c${n}-foot` });
  };
  chap(1,   0, 150,  18,  30,  48);
  chap(2, 150, 300, 166, 174, 192);
  chap(3, 300, 450, 314, 322, 376);
  chap(4, 450, 540, 464, 472, 484);

  mf("c1-claim", { type: "text", chapter: "ch1", frames: [0, 150], still_from: 38,
                   text: "كل أداة بتعرف تعمل فيديو.", critical: true, el: "#c1-claim" });
  mf("c2-claim", { type: "text", chapter: "ch2", frames: [150, 300], still_from: 180,
                   text: "دي بتعرف ترفضه.", critical: true, el: "#c2-claim" });
  mf("c3-report", { type: "text", chapter: "ch3", frames: [300, 450], still_from: 356,
                    text: "", critical: true, el: "#c3-report" });
  mf("c3-verdict", { type: "text", chapter: "ch3", frames: [300, 450], still_from: 366,
                     text: "", critical: true, el: "#c3-verdict" });
  mf("c4-claim", { type: "text", chapter: "ch4", frames: [450, 540], still_from: 480,
                   text: "الفيديو ما بيتسلّمش غير لما يثبت إنه صح.", critical: true,
                   el: "#c4-claim" });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
