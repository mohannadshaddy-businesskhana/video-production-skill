<!doctype html>
<!--
  Demo 01 — brand film.  Built from script.json; run script_check.mjs first.
  HOOK 0–3s · VALUE 3–15s · CTA 15–18s
-->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>محدش فتح فيه بريمير</title>

    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }

      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; --pass-lt:#5E8F78; }

      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); }
      .scene { position:absolute; inset:0; overflow:hidden; }
      .pane  { position:absolute; inset:0; direction:rtl; }

      .tag  { position:absolute; right:88px; top:250px; font-family:"Mono",monospace;
              font-size:26px; letter-spacing:.16em; color:var(--amber);
              direction:ltr; text-align:right; font-weight:700; }
      .line { position:absolute; right:88px; width:904px; font-weight:600;
              line-height:1.36; letter-spacing:-.01em; }
      .xl   { font-size:100px; }
      .lg   { font-size:74px; }
      .md   { font-size:56px; }
      .amber { color:var(--amber); }

      /* ch1 — the frame you are watching, bracketed */
      .brk { position:absolute; border:5px solid var(--amber); width:96px; height:96px; }
      .brk.tl { left:56px;  top:330px;  border-right:none;  border-bottom:none; }
      .brk.tr { right:56px; top:330px;  border-left:none;   border-bottom:none; }
      .brk.bl { left:56px;  bottom:330px; border-right:none; border-top:none; }
      .brk.br { right:56px; bottom:330px; border-left:none;  border-top:none; }

      /* ch2 — three ratios, designed not cropped */
      .ratios { position:absolute; left:0; right:0; top:1140px; height:420px;
                display:flex; align-items:center; justify-content:center; gap:34px; }
      .rt { border:4px solid rgba(245,242,234,.30); border-radius:6px; position:relative;
            background:rgba(245,242,234,.05); }
      .rt::after { content:attr(data-k); position:absolute; left:0; right:0; bottom:-46px;
                   text-align:center; font-family:"Mono",monospace; font-size:24px;
                   color:rgba(245,242,234,.6); font-weight:700; }
      .rt i { position:absolute; left:14%; right:14%; background:var(--amber);
              height:10px; border-radius:5px; }
      .rt i.a { top:26%; } .rt i.b { top:46%; right:40%; } .rt i.c { top:66%; right:28%; }
      .r916 { width:170px; height:302px; }
      .r11  { width:250px; height:250px; }
      .r169 { width:390px; height:219px; }

      /* ch3 — the checks counting through */
      .cnt  { position:absolute; right:88px; top:1080px; width:904px;
              font-size:210px; font-weight:800;
              color:var(--pass-lt); direction:rtl; text-align:right; line-height:1; }
      .cntl { position:absolute; right:88px; top:1392px; width:904px;
              font-size:36px; color:rgba(245,242,234,.6);
              direction:rtl; text-align:right; font-weight:700; }
      .ticks { position:absolute; right:88px; top:1476px; width:904px; display:flex;
               flex-direction:row-reverse; flex-wrap:wrap; gap:14px; }
      .tk { width:46px; height:46px; border:4px solid var(--pass-lt); border-radius:4px; }

      .name { position:absolute; right:88px; top:1500px; width:904px;
              font-family:"Mono",monospace; font-size:40px; letter-spacing:.06em;
              color:var(--amber); direction:ltr; text-align:right; font-weight:700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-fps="30" data-width="1080" data-height="1920">

      <!-- HOOK · 0–3s -->
      <section id="ch1" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="pane">
          <div class="brk tl" id="k1"></div><div class="brk tr" id="k2"></div>
          <div class="brk bl" id="k3"></div><div class="brk br" id="k4"></div>
          <div class="line xl" id="h1" style="top:780px">الفيديو ده<br>محدش فتح فيه <span class="amber">بريمير</span>.</div>
        </div>
      </section>

      <!-- VALUE · comparison · 3–10s -->
      <section id="ch2" class="scene clip" data-start="3" data-duration="7" data-track-index="1">
        <div class="pane">
          <div class="tag" id="v0">01</div>
          <div class="line lg" id="v1" style="top:380px">فيديو زيه كان ياخد<br>يوم ومونتير.</div>
          <div class="line md" id="v2" style="top:700px">أداة واحدة بتكتبه وتبنيه وتفحصه.</div>
          <div class="line md" id="v3" style="top:860px">وبتلات مقاسات <span class="amber">في نفس الوقت</span>.</div>
          <div class="ratios" id="v4">
            <div class="rt r169" data-k="16:9"><i class="a"></i><i class="b"></i><i class="c"></i></div>
            <div class="rt r11"  data-k="1:1"><i class="a"></i><i class="b"></i><i class="c"></i></div>
            <div class="rt r916" data-k="9:16"><i class="a"></i><i class="b"></i><i class="c"></i></div>
          </div>
        </div>
      </section>

      <!-- VALUE · numbers · 10–15s -->
      <section id="ch3" class="scene clip" data-start="10" data-duration="5" data-track-index="2">
        <div class="pane">
          <div class="tag" id="n0">02</div>
          <div class="line xl" id="n1" style="top:420px">من غير <span class="amber">مونتير</span>.</div>
          <div class="line md" id="n2" style="top:700px">وبيعدّي على ١٥ اختبار قبل ما يخرج.</div>
          <div class="cnt"  id="n3">٠</div>
          <div class="cntl" id="n4">اختبار عدّوا</div>
          <div class="ticks" id="n5"></div>
        </div>
      </section>

      <!-- CTA · 15–18s -->
      <section id="ch4" class="scene clip" data-start="15" data-duration="3" data-track-index="3">
        <div class="pane">
          <div class="tag" id="c0">03</div>
          <div class="line lg" id="c1" style="top:720px">تابع —<br>كل يوم <span class="amber">نوع فيديو</span> جديد.</div>
          <div class="name" id="c2">video-production</div>
        </div>
      </section>

      <audio id="bgm" src="assets/music/bed.mp3" data-start="0" data-duration="18"
             data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;
const arabic = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);

function build() {
  // fifteen tick boxes, one per check
  const ticks = document.getElementById("n5");
  for (let i = 0; i < 15; i++) {
    const d = document.createElement("div");
    d.className = "tk"; d.id = "tk" + i;
    ticks.appendChild(d);
  }

  /* initial state OUTSIDE the timeline — tl.set(…,0) does not apply at frame 0 */
  const fade = ["#h1","#v0","#v1","#v2","#v3","#v4","#n0","#n1","#n2","#n3","#n4",
                "#c0","#c1","#c2"];
  gsap.set(fade, { opacity: 0 });
  gsap.set(["#k1","#k2","#k3","#k4"], { opacity: 0, scale: 1.25, transformOrigin: "center" });
  gsap.set(["#h1","#v1","#n1","#c1"], { y: 24 });
  gsap.set(".rt", { scaleY: 0, transformOrigin: "center bottom" });
  gsap.set(".rt i", { scaleX: 0, transformOrigin: "right center" });
  gsap.set(".tk", { opacity: 0, scale: 0.6, transformOrigin: "center" });
  gsap.set(".tk", { backgroundColor: "rgba(94,143,120,0)" });

  const tl = gsap.timeline({ paused: true });
  const rise = { opacity: 1, y: 0, ease: "power2.out" };

  /* ── HOOK · 0–90 · a visual event, then the line ─────────────────── */
  tl.to(["#k1","#k2","#k3","#k4"], { opacity: 1, scale: 1, duration: F(8),
                                     stagger: F(2), ease: "power3.out" }, F(0));
  tl.to("#h1", { ...rise, duration: F(14) }, F(2));

  /* ── VALUE · 90–300 ─────────────────────────────────────────────── */
  tl.to("#v0", { opacity: 1, duration: F(8) }, F(94));
  tl.to("#v1", { ...rise, duration: F(14) }, F(96));
  tl.to("#v2", { opacity: 1, duration: F(14) }, F(140));
  tl.to("#v3", { opacity: 1, duration: F(14) }, F(190));
  tl.to("#v4", { opacity: 1, duration: F(2) }, F(200));
  tl.to(".rt", { scaleY: 1, duration: F(14), stagger: F(6), ease: "back.out(1.4)" }, F(200));
  // once the last line has been read, each frame lays its own content out —
  // the frame had sat still for 0.7s before the next chapter (dead air, #49)
  tl.to(".rt i", { scaleX: 1, duration: F(10), stagger: F(4), ease: "power2.out" }, F(250));
  window.__MOTION.push({ id: "ratios-fill", frames: [250, 292], magnitude: "small" });

  /* ── VALUE · numbers · 300–450 ──────────────────────────────────── */
  tl.to("#n0", { opacity: 1, duration: F(8) }, F(304));
  tl.to("#n1", { ...rise, duration: F(12) }, F(306));
  tl.to("#n2", { opacity: 1, duration: F(14) }, F(350));
  tl.to(["#n3","#n4"], { opacity: 1, duration: F(8) }, F(312));
  // the counter is driven by onUpdate over an object — tl.call is skipped on seek
  const c = { v: 0 };
  tl.to(c, { v: 15, duration: F(70), ease: "power1.out",
             onUpdate: () => { document.getElementById("n3").textContent = arabic(Math.round(c.v)); } }, F(316));
  tl.to(".tk", { opacity: 1, scale: 1, backgroundColor: "rgba(94,143,120,.55)",
                 duration: F(6), stagger: F(4.4), ease: "power2.out" }, F(316));

  /* ── CTA · 450–540 ──────────────────────────────────────────────── */
  tl.to("#c0", { opacity: 1, duration: F(8) }, F(454));
  tl.to("#c1", { ...rise, duration: F(16) }, F(456));
  tl.to("#c2", { opacity: 1, duration: F(12) }, F(470));

  /* ── music — one continuous track, gain automation only (#26 #27) ─ */
  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.40, duration: 0.9, ease: "none",
            immediateRender: false }, 0);
  tl.to("#bgm", { volume: 0.29, duration: F(8), ease: "none" }, F(300));
  tl.to("#bgm", { volume: 0.40, duration: F(20), ease: "none" }, F(340));
  tl.to("#bgm", { volume: 0, duration: 1.4, ease: "none" }, F(498));

  /* ── the manifest — still_from is where each tween actually ends ── */
  const t = (id, ch, fr, still, text, crit) =>
    mf(id, { type: "text", chapter: ch, frames: fr, still_from: still, text: text,
             critical: crit !== false, el: "#" + id });
  const sh = (id, ch, fr, still) =>
    mf(id, { type: "shape", chapter: ch, frames: fr, still_from: still,
             critical: false, el: "#" + id });

  sh("k1", "ch1", [0, 90], 8); sh("k4", "ch1", [0, 90], 14);
  t("h1", "ch1", [0, 90], 16, "الفيديو ده محدش فتح فيه بريمير.");

  t("v0", "ch2", [90, 300], 102, "", false);
  t("v1", "ch2", [90, 300], 110, "فيديو زيه كان ياخد يوم ومونتير.");
  t("v2", "ch2", [90, 300], 154, "أداة واحدة بتكتبه وتبنيه وتفحصه.");
  t("v3", "ch2", [90, 300], 204, "وبتلات مقاسات في نفس الوقت.");
  sh("v4", "ch2", [90, 300], 220);

  t("n0", "ch3", [300, 450], 312, "", false);
  t("n1", "ch3", [300, 450], 318, "من غير مونتير.");
  t("n2", "ch3", [300, 450], 364, "وبيعدّي على ١٥ اختبار قبل ما يخرج.");
  t("n3", "ch3", [300, 450], 386, "١٥", false);
  t("n4", "ch3", [300, 450], 320, "اختبار عدّوا", false);
  sh("n5", "ch3", [300, 450], 386);

  t("c0", "ch4", [450, 540], 462, "", false);
  t("c1", "ch4", [450, 540], 472, "تابع — كل يوم نوع فيديو جديد.");
  t("c2", "ch4", [450, 540], 482, "", false);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
