<!doctype html>
<!--
  Demo 07 — music video.  v2.

  v1 pulsed a bar field over a still frame: a visualiser, and the same
  fade-in-a-heading grammar as every other demo. What makes a music video is
  that THE EDIT IS THE RHYTHM, so v2 cuts the whole frame on every beat —
  33 hard cuts in 18 seconds, a new ground and a new composition each time,
  and not one fade.

  The grid is read from the track, not typed in. `hyperframes beats` gives an
  onset every 0.273s from t=0; every other one is a quarter note, so a beat
  lands every 16.36 frames (110 BPM). Which beat is the "one" is read from the
  strengths: odd quarters are the loudest (the snare on 2 and 4), and of the
  even ones k%4==0 beats k%4==2, so the bar starts on k=0. At k=16 every
  strength jumps from ~0.35 to ~0.73 — the track opens up there, and the
  claim is timed to land on it.

  The edit follows the track the way an editor would:
    bars 1-4  two colours, a zoom hit on the "one" only
    k=16      two white frames on the drop, then three colours and a hit on
              every beat
    bars 8-9  back to two colours for the close

  Quarter-note cuts at 110 BPM are 1.8 luminance changes a second — under the
  three-flashes-a-second limit. Cutting on the eighths would not be.

  The line sits on a card that never moves while it is read: the frame is the
  rhythm, the card is the message. A cut is a state, not a motion, so nothing
  here is registered in __MOTION.

  Cold-read ledger (script.json):
    ch1 0-65     establishes  the picture cuts with the beat
    ch2 65-196   needs ch1 · establishes the tool listens to the song, counting by hand costs time
    ch3 196-262  needs ch2 · establishes every beat has a place
    ch4 262-458  needs ch3 · establishes every move lands on the beat  (the claim, on the drop)
    cta 458-540  needs ch4
-->
<html lang="ar">

      /* one composition per cut. Every shape is thick and axis-aligned or

      .shot { position:absolute; inset:0; visibility:hidden; transform-origin:540px 960px;

                   letter-spacing:.12em; color:var(--amber); direction:ltr; text-align:right; }

  <body>

          <i class="b" style="left:730px;top:1200px;width:262px;height:150px;border-radius:20px"></i>

        </div>

        <div id="metro"><i id="m0"></i><i id="m1"></i><i id="m2"></i><i id="m3"></i></div>

        <div class="slot"><div class="card" id="k1">
          <div class="ln">كل انتقال —<br><span class="x">على الضربة.</span></div></div></div>
        <div class="slot"><div class="card" id="k2">
          <div class="ln">الأداة بتسمع الأغنية<br><span class="x">بدل ما تعدّها بإيدك.</span></div></div></div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;

const BEAT = 30 * 0.54545;                 // frames per quarter note, from the beat map
const beat = (k) => Math.round(k * BEAT);
const END = 540, DROP = 16, CLOSE = 28;
const INK = "#14181F", BONE = "#F5F2EA", AMBER = "#C77B0E", WHITE = "#FFFFFF";

/* the edit: [composition, ground, fill a, fill b] for each of the 33 beats.
   Written out rather than generated — an edit is a sequence of choices, and
   no two neighbours share a ground or a composition, so every cut reads. */
const CUTS = [
  ["sun", AMBER, INK, INK],     ["wave", BONE, INK, INK],     ["disc", AMBER, INK, INK],    ["split", BONE, INK, INK],
  ["film", INK, AMBER, AMBER],  ["phone", BONE, INK, INK],    ["steps", AMBER, INK, INK],   ["wave", BONE, AMBER, AMBER],
  ["disc", INK, AMBER, AMBER],  ["line", BONE, INK, INK],     ["sun", AMBER, BONE, BONE],   ["split", BONE, AMBER, AMBER],
  ["wave", INK, BONE, BONE],    ["film", AMBER, INK, INK],    ["phone", BONE, AMBER, AMBER],["steps", AMBER, INK, INK],
  // the drop — three colours from here
  ["sun", INK, AMBER, BONE],    ["disc", AMBER, INK, BONE],   ["wave", BONE, INK, AMBER],   ["line", INK, AMBER, BONE],
  ["split", AMBER, INK, BONE],  ["film", BONE, INK, AMBER],   ["phone", INK, AMBER, BONE],  ["steps", BONE, AMBER, INK],
  ["disc", INK, BONE, AMBER],   ["wave", AMBER, INK, BONE],   ["sun", BONE, INK, AMBER],    ["line", AMBER, BONE, INK],
  // the close — back to two
  ["phone", INK, AMBER, AMBER], ["split", BONE, INK, INK],    ["disc", AMBER, INK, INK],    ["wave", BONE, INK, INK],
  ["sun", INK, AMBER, BONE],
];
const hitOn = (k) => (k >= DROP && k < CLOSE) || k % 4 === 0;

const CARDS = [["k1", 0, beat(4)], ["k2", beat(4), beat(12)], ["k3", beat(12), beat(DROP)],
               ["k4", beat(DROP), beat(CLOSE)], ["k5", beat(CLOSE), END]];
const LINES = ["كل انتقال — على الضربة.", "الأداة بتسمع الأغنية بدل ما تعدّها بإيدك.",
               "وبتحدد مكان كل ضربة فيها.", "وكل حركة بتقع في مكانها.",
               "تابع — نوع جديد بكرة. video-production"];

function drawFilm() {
  for (const id of ["fl", "fr"]) {
    const strip = document.getElementById(id);
    for (let y = 40; y < 1920; y += 150) {
      const hole = document.createElement("i");
      hole.className = "g";
      hole.style.cssText = `left:58px;top:${y}px;width:64px;height:84px;border-radius:12px`;
      strip.appendChild(hole);
    }
  }
}

function build() {
  drawFilm();
  const tl = gsap.timeline({ paused: true });
  // a tl.set at 0 does not apply on frame 0; frame-0 state goes through gsap.set
  const put = (at, sel, v) => (at === 0 ? gsap.set(sel, v) : tl.set(sel, v, F(at)));
  // a hit is three stepped states, not a tween — it seeks the same both ways
  const hit = (at, sel, s) => {
    put(at, sel, { scale: s });
    tl.set(sel, { scale: 1 + (s - 1) * 0.4 }, F(at + 2));
    tl.set(sel, { scale: 1 }, F(at + 4));
  };

  CUTS.forEach(([shot, g, a, b], k) => {
    const f = beat(k), sel = "#sh-" + shot;
    if (k) put(f, "#sh-" + CUTS[k - 1][0], { visibility: "hidden" });
    let at = f;
    if (k === DROP) { put(f, "#bg", { backgroundColor: WHITE }); at = f + 2; }
    put(at, "#bg", { backgroundColor: g });
    put(at, sel, { visibility: "visible", "--a": a, "--b": b, "--g": g });
    if (hitOn(k)) hit(at, sel, 1.1);
    for (let i = 0; i < 4; i++)
      put(f, "#m" + i, i === k % 4 ? { backgroundColor: i ? BONE : AMBER, opacity: 1 }
                                   : { backgroundColor: BONE, opacity: 0.22 });
  });

  CARDS.forEach(([id, s, e]) => {
    put(s, "#" + id, { visibility: "visible" });
    hit(s, "#" + id, 1.04);
    if (e < END) tl.set("#" + id, { visibility: "hidden" }, F(e));
  });

  /* music — one continuous track, gain automation only (#26 #27) */
  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.5, duration: F(3), ease: "none",
            immediateRender: false }, 0);
  tl.to("#bgm", { volume: 0, duration: F(END - 504), ease: "none" }, F(504));

  CARDS.forEach(([id, s, e], i) =>
    mf(id, { type: "text", chapter: "cut", frames: [s, e], still_from: s + 6,
             text: LINES[i], critical: true, el: "#" + id }));
  CUTS.forEach(([shot], k) =>
    mf("cut" + String(k).padStart(2, "0"), { type: "shape", chapter: "cut",
       frames: [beat(k), k + 1 < CUTS.length ? beat(k + 1) : END], still_from: beat(k),
       critical: false, el: "#sh-" + shot + " .h" }));
  mf("metro", { type: "shape", chapter: "cut", frames: [0, END], still_from: 0,
                critical: false, el: "#metro" });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
