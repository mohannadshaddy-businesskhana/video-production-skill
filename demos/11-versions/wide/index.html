  Demo 06 — motion graphics.  v2.   Format: wide (1920×1080) · language: ar

  GENERATED by demos/_src/motion-graphics/emit.mjs — edit film.html and
  formats.mjs there, never this file. The timeline below is shared verbatim by
  every ratio and language; only the geometry and the strings differ
  (references/formats.md, routes/localization.md).

  v1 was type fading in on a plain ground — a slideshow, and the same grammar
  as every other demo. What makes motion graphics is CONTINUITY: nothing cuts,
  nothing fades, every shape becomes the next one. v2 is one amber shape for
  the whole 18 seconds:

    a circle → a long bar (a shoot day) → one small block → a chart column
    with its number → three steps, built one after another → the circle it
    started as → the button that carries the tool's name.

  Nothing appears without moving. Each line pushes the last one out of its
  window, the number rises from behind the block, the step labels wipe up out
  of the steps, the name opens from the middle of the button.

  The shape moves, then holds, and every line is read while it holds: each
  morph is registered in __MOTION and every still_from sits after its morph.
  Morphs start on the music's beats (a quarter note every 16.36 frames), so
  the piece moves with the track without being cut to it — that is 07.

  Cold-read ledger (script.json):
    ch1 0-82     establishes  this video has no filming in it
    ch2 82-213   needs ch1 · establishes a tool makes the video from an idea, a shoot takes a day
    ch3 213-311  needs ch2 · establishes a number can be explained by motion
    ch4 311-409  needs ch3 · establishes steps can be explained by motion
    ch5 409-475  needs ch4 · establishes any idea, no filming  (the claim)
    cta 475-540  needs ch5
-->

    <script>
const G = {"id":"wide","w":1920,"h":1080,"safe":[130,778],"DOT":[460,385,120,120,60],"CIRCLE":[290,215,460,460,230],"BAR":{"A":[647,620,253,120,[0,60,60,0]],"B":[393,620,254,120,0],"C":[140,620,253,120,[60,0,0,60]]},"BLOCK":[440,620,160,120,30],"COLUMN":{"A":[430,594,180,146,[0,0,30,30]],"B":[430,447,180,147,0],"C":[430,300,180,147,[30,30,0,0]]},"STEPS":{"A":[680,620,220,120,24],"B":[410,500,220,240,24],"C":[140,380,220,360,24]},"PILL":[210,365,620,160,80],"base":[140,740,760],"cnt":{"box":[320,170,400,110],"size":110,"from":455},"lbl":{"w":220,"h":80,"size":64,"at":[[680,630],[410,510],[140,390]]},"tag":{"size":44},"win":{"box":[1040,360,792,190],"top":12,"size":64,"push":210}};
const L = {"digits":"arabic","pct":"٪","text":["الفيديو ده مفيهوش كاميرا.","أداة بتعمل الفيديو من فكرة، بدل يوم تصوير.","عندك رقم؟ بيكبر قدامك.","عندك خطوات؟ بتتبني ورا بعض.","وكله من غير تصوير.","تابع — نوع جديد بكرة."]};
window.__FMT = { id: G.id, w: G.w, h: G.h, safeTop: G.safe[0], safeBottom: G.safe[1], zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;

/* every chapter starts on a beat of the track: beats 5, 13, 19, 25 and 29 */
const CH = [["k1", 0, 82], ["k2", 82, 213], ["k3", 213, 311], ["k4", 311, 409],
            ["k5", 409, 475], ["k6", 475, 540]];
/* each morph, and the frame its line can be read from once it has stopped */
const MOVES = [[0, 20], [82, 130], [213, 245], [311, 351], [409, 425], [475, 491]];
const TEXT = L.text;

/* a box, with its corners in CSS order: top-left, top-right, bottom-right, bottom-left */
const box = ([x, y, w, h, r]) => {
  const [r0, r1, r2, r3] = typeof r === "number" ? [r, r, r, r] : r;
  return { x, y, w, h, r0, r1, r2, r3 };
};
const trio = (t) => ({ A: box(t.A), B: box(t.B), C: box(t.C) });
const DOT = box(G.DOT), CIRCLE = box(G.CIRCLE), BLOCK = box(G.BLOCK), PILL = box(G.PILL);
const BAR = trio(G.BAR), COLUMN = trio(G.COLUMN), STEPS = trio(G.STEPS);
const IDS = ["A", "B", "C"];
const arabic = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
const num = (n) => (L.digits === "arabic" ? arabic(n) : String(n));

/* the box as a path; a corner never exceeds half the short side */
function rrect({ x, y, w, h, r0, r1, r2, r3 }) {
  const m = Math.min(w, h) / 2, c = (r) => Math.max(0, Math.min(r, m));
  const [a, b, d, e] = [c(r0), c(r1), c(r2), c(r3)];
  return `M${x + a},${y}H${x + w - b}A${b},${b} 0 0 1 ${x + w},${y + b}`
       + `V${y + h - d}A${d},${d} 0 0 1 ${x + w - d},${y + h}`
       + `H${x + e}A${e},${e} 0 0 1 ${x},${y + h - e}`
       + `V${y + a}A${a},${a} 0 0 1 ${x + a},${y}Z`;
}

function build() {
  const tl = gsap.timeline({ paused: true });
  const EASE = "power3.inOut";
  const P = { A: { ...DOT }, B: { ...DOT }, C: { ...DOT } };   // frame 0 already has a shape in it
  const path = Object.fromEntries(IDS.map((id) => [id, document.getElementById("p" + id)]));
  const draw = () => IDS.forEach((id) => path[id].setAttribute("d", rrect(P[id])));
  const morph = (id, to, at, dur) =>
    tl.to(P[id], { ...to, duration: F(dur), ease: EASE, onUpdate: draw }, F(at));
  const all = (state, at, dur) => IDS.forEach((id) => morph(id, state[id] || state, at, dur));
  draw();
  const wipe = (sel, from, to, at, dur, ease) =>
    tl.fromTo(sel, { clipPath: from }, { clipPath: to, duration: F(dur), ease,
              immediateRender: false }, F(at));
  const SHUT_TOP = "inset(100% 0% 0% 0%)", OPEN = "inset(0% 0% 0% 0%)";

  /* ── the shape: one piece of amber for the whole film ──────────── */
  all(CIRCLE, 0, 20);                                 // ch1  the dot grows
  all(BAR, 82, 20);                                   // ch2  it squashes into a day
  all(BLOCK, 110, 20);                                //      and the day folds into one block
  all(COLUMN, 213, 32);                               // ch3  the block rises into a column
  IDS.forEach((id, i) => morph(id, STEPS[id], 311 + i * 6, 20));   // ch4  one step after another
  all(CIRCLE, 409, 16);                               // ch5  back to where it started
  tl.set(["#pB", "#pC"], { visibility: "hidden" }, F(475));        // they sit exactly under A
  morph("A", PILL, 475, 16);                          // cta  the circle opens into the button

  /* the chart's ground line draws with the column and goes with the steps */
  gsap.set("#base", { scaleX: 0 });
  tl.to("#base", { scaleX: 1, duration: F(24), ease: EASE }, F(213));
  tl.to("#base", { scaleX: 0, duration: F(14), ease: EASE }, F(409));

  /* the number starts behind the block and rises out of it as it counts */
  const cnt = document.getElementById("cnt"), n = { v: 0 };
  gsap.set("#cnt", { y: G.cnt.from });                // down at the block, behind it
  tl.set("#cnt", { visibility: "visible" }, F(213));
  tl.to("#cnt", { y: 0, duration: F(32), ease: EASE }, F(213));
  tl.to(n, { v: 100, duration: F(32), ease: EASE,
             onUpdate: () => { cnt.textContent = num(Math.round(n.v)) + L.pct; } }, F(213));
  wipe("#cnt", OPEN, SHUT_TOP, 311, 10, "power2.in");
  tl.set("#cnt", { visibility: "hidden" }, F(321));

  /* each step's number wipes up out of it as the step lands */
  ["l1", "l2", "l3"].forEach((id, i) => {
    const at = 331 + i * 6;
    tl.set("#" + id, { visibility: "visible" }, F(at));
    wipe("#" + id, SHUT_TOP, OPEN, at, 8, "power2.out");
    tl.to("#" + id, { clipPath: SHUT_TOP, duration: F(6), ease: "power2.in" }, F(409));
    tl.set("#" + id, { visibility: "hidden" }, F(415));
  });

  /* the tool's name opens from the middle of the button */
  tl.set("#tag", { visibility: "visible" }, F(479));
  wipe("#tag", "inset(0% 50% 0% 50%)", OPEN, 479, 12, "power3.out");

  /* ── the words: each line pushes the last one out of the window ── */
  gsap.set(".ln", { y: G.win.push });
  gsap.set("#k1", { y: 0, visibility: "visible" });
  CH.forEach(([id, at], i) => {
    if (!i) return;
    const prev = "#" + CH[i - 1][0];
    tl.set("#" + id, { visibility: "visible" }, F(at));
    tl.to("#" + id, { y: 0, duration: F(14), ease: EASE }, F(at));
    tl.to(prev, { y: -G.win.push, duration: F(14), ease: EASE }, F(at));
    tl.set(prev, { visibility: "hidden" }, F(at + 14));
  });

  /* ── music under the moves — one track, gain automation only (#26 #27) */
  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.3, duration: 0.5, ease: "none",
            immediateRender: false }, 0);
  tl.to("#bgm", { volume: 0, duration: F(36), ease: "none" }, F(504));

  /* ── the manifest ───────────────────────────────────────────────── */
  MOVES.forEach(([a, b], i) =>
    window.__MOTION.push({ id: "morph" + (i + 1), frames: [a, b], magnitude: "large" }));
  CH.forEach(([id, a, b], i) =>
    mf(id, { type: "text", chapter: "mg", frames: [a, b], still_from: MOVES[i][1],
             text: TEXT[i], critical: true, el: "#" + id }));
  mf("cnt", { type: "text", chapter: "mg", frames: [213, 311], still_from: 245,
              text: num(100) + L.pct, critical: true, el: "#cnt" });
  ["l1", "l2", "l3"].forEach((id, i) =>
    mf(id, { type: "text", chapter: "mg", frames: [331 + i * 6, 409], still_from: 351,
             text: num(i + 1), critical: true, el: "#" + id }));
  mf("tag", { type: "text", chapter: "mg", frames: [479, 540], still_from: 491,
              text: "video-production", critical: true, el: "#tag" });
  CH.forEach(([id, a, b], i) => IDS.forEach((s) => {
    if (i === CH.length - 1 && s !== "A") return;
    mf(s.toLowerCase() + "-" + id, { type: "shape", chapter: "mg", frames: [a, b],
       still_from: MOVES[i][1], critical: false, el: "#p" + s });
  }));
  mf("base", { type: "shape", chapter: "mg", frames: [213, 409], still_from: 237,
               critical: false, el: "#base" });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
