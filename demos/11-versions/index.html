<!doctype html>
<!--
  Demo 11 — aspect versions.  v2.

  v1 was a spec table: a document about versions instead of versions. An
  operation is shown on a film that exists, so v2 plays the motion-graphics
  film (06) in its three ratios, side by side and in sync — the real renders,
  not mock-ups. Each was generated from ONE timeline and a geometry table per
  ratio (demos/_src/motion-graphics), so the same moment is on screen in all
  three, laid out three ways: in the wide frame the words move to the right,
  where Arabic starts, and the shape to the left; the square is a shorter
  chart with its number kept inside the safe band.

  The only moving things are the three films. The captions cut, and a frame
  lights around the version being named.

  Needs the three renders in media/ — see demos/README.md.

  Cold-read ledger (script.json):
    ch1 0-65      establishes  one video has three sizes
    ch2 65-196    needs ch1 · establishes a tool re-lays it per size; cropping loses the design
    ch3-ch5       each size and what it is for
    claim 393-458 needs ch5 · establishes the video is whole in every size
    cta 458-540   needs claim
-->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>نفس الفيديو بتلات مقاسات</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); background:var(--ink); }
      .scene { position:absolute; inset:0; }

      /* the three films — the real renders, in sync */
      .tile { position:absolute; border-radius:16px; object-fit:cover; background:var(--bone); }
      #v-wide   { left:60px;  top:430px;  width:960px; height:540px; }
      #v-square { left:82px;  top:1060px; width:560px; height:560px; }
      #v-tall   { left:682px; top:1060px; width:315px; height:560px; }

      /* a frame around each; it lights when its version is named */
      .ring { position:absolute; border:6px solid rgba(245,242,234,.22); border-radius:22px; }
      #r-wide   { left:52px;  top:422px;  width:976px; height:556px; }
      #r-square { left:74px;  top:1052px; width:576px; height:576px; }
      #r-tall   { left:674px; top:1052px; width:331px; height:576px; }

      .lab { position:absolute; font-size:34px; font-weight:700; color:rgba(245,242,234,.72);
             direction:rtl; text-align:right; line-height:1.2; }
      #l-wide   { right:60px;  top:992px;  width:600px; }
      #l-square { right:438px; top:1640px; width:560px; }
      #l-tall   { right:83px;  top:1640px; width:315px; }

      .cap { position:absolute; right:88px; top:250px; width:904px; height:160px;
             display:flex; flex-direction:column; justify-content:center; visibility:hidden; }
      .cap .t { direction:rtl; text-align:right; font-size:58px; font-weight:800; line-height:1.3;
                letter-spacing:-.01em; text-wrap:balance; }
      .cap .x { color:var(--amber); }
      .cap .tag { margin-top:10px; font-family:"Mono",monospace; font-size:30px; font-weight:700;
                  letter-spacing:.1em; color:var(--amber); direction:ltr; text-align:right; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-fps="30" data-width="1080" data-height="1920">
      <!-- the films sit on the stage directly: a timed <video> inside a timed wrapper is resolved twice -->
      <video id="v-wide" class="clip tile" src="media/wide.mp4" muted playsinline
             data-start="0" data-duration="18" data-track-index="1"></video>
      <video id="v-square" class="clip tile" src="media/square.mp4" muted playsinline
             data-start="0" data-duration="18" data-track-index="2"></video>
      <video id="v-tall" class="clip tile" src="media/vertical.mp4" muted playsinline
             data-start="0" data-duration="18" data-track-index="3"></video>

      <section id="board" class="scene clip" data-start="0" data-duration="18" data-track-index="0">
        <div class="ring" id="r-wide"></div><div class="ring" id="r-square"></div><div class="ring" id="r-tall"></div>
        <div class="lab" id="l-wide">عريض · ١٦:٩</div>
        <div class="lab" id="l-square">مربع · ١:١</div>
        <div class="lab" id="l-tall">طولي · ٩:١٦</div>

        <div class="cap" id="k1"><div class="t">نفس الفيديو، <span class="x">بتلات مقاسات.</span></div></div>
        <div class="cap" id="k2"><div class="t">أداة بتعمل الفيديو، وبترتّبه لكل مقاس <span class="x">بدل ما تقصّه.</span></div></div>
        <div class="cap" id="k3"><div class="t"><span class="x">طولي</span> للموبايل،</div></div>
        <div class="cap" id="k4"><div class="t"><span class="x">مربع</span> للبوست،</div></div>
        <div class="cap" id="k5"><div class="t">و<span class="x">عريض</span> ليوتيوب.</div></div>
        <div class="cap" id="k6"><div class="t">ومفيش حاجة <span class="x">اتقصّت.</span></div></div>
        <div class="cap" id="k7"><div class="t">تابع — <span class="x">نوع جديد بكرة.</span></div>
          <div class="tag">video-production</div></div>
      </section>

      <!-- the film's own mix, music and effects, from the vertical render -->
      <audio id="mix" src="media/vertical.mp4" data-start="0" data-duration="18"
             data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;

const CH = [["k1", 0, 65], ["k2", 65, 196], ["k3", 196, 262], ["k4", 262, 327],
            ["k5", 327, 393], ["k6", 393, 458], ["k7", 458, 540]];
const TEXT = ["نفس الفيديو، بتلات مقاسات.", "أداة بتعمل الفيديو، وبترتّبه لكل مقاس بدل ما تقصّه.",
              "طولي للموبايل،", "مربع للبوست،", "وعريض ليوتيوب.", "ومفيش حاجة اتقصّت.",
              "تابع — نوع جديد بكرة. video-production"];
/* which frames are lit in each chapter: all, one of them, or all in amber */
const DIM = "rgba(245,242,234,.22)", LIT = "#F5F2EA", ON = "#C77B0E";
const RINGS = ["wide", "square", "tall"];
const LIGHT = [
  { wide: LIT, square: LIT, tall: LIT }, { wide: LIT, square: LIT, tall: LIT },
  { wide: DIM, square: DIM, tall: ON },  { wide: DIM, square: ON, tall: DIM },
  { wide: ON, square: DIM, tall: DIM },  { wide: ON, square: ON, tall: ON },
  { wide: LIT, square: LIT, tall: LIT },
];

function build() {
  const tl = gsap.timeline({ paused: true });
  // a tl.set at 0 does not apply on frame 0; frame-0 state goes through gsap.set
  const put = (at, sel, v) => (at === 0 ? gsap.set(sel, v) : tl.set(sel, v, F(at)));

  CH.forEach(([id, s, e], i) => {
    put(s, "#" + id, { visibility: "visible" });
    if (e < 540) tl.set("#" + id, { visibility: "hidden" }, F(e));
    RINGS.forEach((r) => put(s, "#r-" + r, { borderColor: LIGHT[i][r] }));
  });

  /* the mix is the film's own, already normalised — a short fade at each end only */
  tl.fromTo("#mix", { volume: 0 }, { volume: 1, duration: F(3), ease: "none",
            immediateRender: false }, 0);
  tl.to("#mix", { volume: 0, duration: F(24), ease: "none" }, F(516));

  CH.forEach(([id, s, e], i) =>
    mf(id, { type: "text", chapter: "board", frames: [s, e], still_from: s + 2,
             text: TEXT[i], critical: true, el: "#" + id }));
  [["l-wide", "عريض · ١٦:٩"], ["l-square", "مربع · ١:١"], ["l-tall", "طولي · ٩:١٦"]].forEach(([id, t]) =>
    mf(id, { type: "text", chapter: "board", frames: [0, 540], still_from: 0,
             text: t, critical: true, el: "#" + id }));
  RINGS.forEach((r) => {
    mf("v-" + r, { type: "video", chapter: "board", frames: [0, 540], still_from: 0,
                   critical: false, el: "#v-" + r });
    mf("r-" + r, { type: "shape", chapter: "board", frames: [0, 540], still_from: 0,
                   critical: false, el: "#r-" + r });
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
