<!doctype html>
<!--
  Demo 13 — cutdown: bumper (6s).

  GENERATED by demos/_src/cutdowns/emit.mjs — edit it there, never this file.

  A cutdown of the product tour (08), made the way an editor makes one: the
  picture and effects come from a textless master cut by marked segments
  (13-cutdowns/marks.json → scripts/cutdown.mjs), and this version lays its
  OWN words and one continuous music bed on top. The long version's captions
  would say the wrong thing here, and its music cut at every splice would jump
  off the beat.

  The captions are the tour's, in the tour's band and grammar. Every line is
  read while the camera in the footage is still: the tour's camera moves,
  mapped through the cut, are registered as motion.
-->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>أداة بتعمل الفيديو من سطر واحد</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); background:var(--ink); }
      .scene { position:absolute; inset:0; }
      #cut { position:absolute; left:0; top:0; width:1080px; height:1920px; }
      /* where the product sits in the footage — its own colours, not the brand's */
      #ui { position:absolute; left:40px; top:470px; width:1000px; height:1200px; }

      /* the tour's caption band — one inline run, so the emphasis never splits off */
      .cap { position:absolute; right:88px; top:250px; width:904px; height:180px;
             display:flex; flex-direction:column; justify-content:center; }
      .cap > span { display:block; width:100%; direction:rtl; text-align:right; text-wrap:balance;
                    font-size:60px; font-weight:700; line-height:1.32; letter-spacing:-.01em; }
      .cap .a { color:var(--amber); }
      .cap .tag { margin-top:8px; font-family:"Mono",monospace; font-size:30px; font-weight:700;
                  letter-spacing:.1em; color:var(--amber); direction:ltr; text-align:right; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6"
         data-fps="30" data-width="1080" data-height="1920">
      <video id="cut" class="clip" src="media/cut.mp4" muted playsinline
             data-start="0" data-duration="6" data-track-index="1"></video>
      <section id="words" class="scene clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="ui"></div>
        <div class="cap" id="c1"><span>أداة بتعمل الفيديو من <span class="a">سطر واحد</span>.</span></div>
        <div class="cap" id="c2"><span>جرّبه — <span class="a">اللينك في البايو</span>.</span><div class="tag">video-production</div></div>
      </section>
      <!-- the effects travel with the picture they belong to; the music is laid fresh, unbroken -->
      <audio id="fx" src="media/cut.mp4" data-start="0" data-duration="6"
             data-track-index="10" data-volume="1"></audio>
      <audio id="bgm" src="assets/music/bed.mp3" data-start="0" data-duration="6"
             data-track-index="11" data-volume="1"></audio>
    </div>

    <script>
const V = {"frames":180,"motion":[[0,14,"intro"],[160,180,"ease-back"]],"captions":[{"id":"c1","at":14,"end":90,"text":"أداة بتعمل الفيديو من سطر واحد."},{"id":"c2","at":92,"end":180,"text":"جرّبه — اللينك في البايو. video-production"}]};
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = V.motion.map(([a, b, id]) => ({ id, frames: [a, b], magnitude: "large" }));
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;
const END = V.frames;

function build() {
  const tl = gsap.timeline({ paused: true });
  /* the tour's caption grammar: rise in, hold, fade out before the next */
  V.captions.forEach(({ id, at, end }) => {
    gsap.set("#" + id, { opacity: 0, y: 20 });
    tl.to("#" + id, { opacity: 1, y: 0, duration: F(11), ease: "power2.out" }, F(at));
    if (end < END) tl.to("#" + id, { opacity: 0, duration: F(6) }, F(end - 6));
  });

  /* one continuous bed under the cut: in fast, out over the last second */
  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.34, duration: F(9), ease: "none",
            immediateRender: false }, 0);
  tl.to("#bgm", { volume: 0, duration: F(36), ease: "none" }, F(END - 36));

  V.captions.forEach(({ id, at, end, text }) =>
    mf(id, { type: "text", chapter: "words", frames: [at, end], still_from: at + 11,
             text, critical: true, el: "#" + id }));
  mf("ui", { type: "ui", chapter: "words", frames: [0, END], still_from: 0,
             critical: false, el: "#ui" });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
