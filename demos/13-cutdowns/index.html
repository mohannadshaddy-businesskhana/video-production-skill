<!doctype html>
<!--
  Demo 13 — cutdowns.  v2.

  v1 drew a horizontal track that got shorter — a diagram of the operation.
  v2 plays the operation's results: the product tour at full length, its 15s
  cut and its 6s bumper, side by side from the same first frame. The short ones
  loop the way they would run as ads, so the viewer sees each one START again —
  and each starts on its own hook and ends on its own close.

  How they were made (13-cutdowns/marks.json): a textless master of the tour
  (_src/textless.mjs) is cut by marked segments with scripts/cutdown.mjs, frame-
  exact; each cut then gets its own words and an unbroken music bed
  (_src/cutdowns). Needs the three renders in media/ — see demos/README.md.

  Cold-read ledger (script.json):
    ch1 0-65      establishes  one video, three lengths
    ch2 65-196    needs ch1 · establishes a tool shortens it; cutting the end off loses the meaning
    ch3-ch5       each length and where it runs
    claim 589-655 needs ch5 · establishes every length is a whole video
    cta 655-720   needs claim
-->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>نفس الفيديو بتلات أطوال</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); background:var(--ink); }
      .scene { position:absolute; inset:0; }

      /* three lengths, one tile each — the full one on the right, where Arabic starts */
      .tile { position:absolute; top:540px; width:340px; height:604px; border-radius:16px;
              object-fit:cover; background:var(--ink); }
      .t-full { left:725px; } .t-short { left:370px; } .t-bump { left:15px; }
      .ring { position:absolute; top:532px; width:356px; height:620px; border-radius:22px;
              border:6px solid rgba(245,242,234,.22); }
      #r-full { left:717px; } #r-short { left:362px; } #r-bump { left:7px; }

      .len { position:absolute; top:1180px; width:340px; text-align:center; direction:rtl; }
      /* number and unit on ONE line: stacked, Cairo's tall line box put the
         number inside the unit below it */
      .len b { font-size:110px; font-weight:800; line-height:1.2; color:var(--amber); }
      .len span { margin-right:12px; font-size:34px; font-weight:700; color:rgba(245,242,234,.72); }
      #n-full { left:725px; } #n-short { left:370px; } #n-bump { left:15px; }

      .cap { position:absolute; right:88px; top:250px; width:904px; height:160px;
             display:flex; flex-direction:column; justify-content:center; visibility:hidden; }
      .cap .t { direction:rtl; text-align:right; font-size:58px; font-weight:800; line-height:1.3;
                letter-spacing:-.01em; text-wrap:balance; }
      .cap .x { color:var(--amber); }
      .cap .tag { margin-top:10px; font-family:"Mono",monospace; font-size:30px; font-weight:700;
                  letter-spacing:.1em; color:var(--amber); direction:ltr; text-align:right; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24"
         data-fps="30" data-width="1080" data-height="1920">
      <!-- the full tour once; the 15s cut twice; the bumper four times, as an ad loops -->
      <video id="v-full" class="clip tile t-full" src="media/full.mp4" muted playsinline
             data-start="0" data-duration="24" data-track-index="1"></video>
      <video id="v-short-1" class="clip tile t-short" src="media/short.mp4" muted playsinline
             data-start="0" data-duration="15" data-track-index="2"></video>
      <video id="v-short-2" class="clip tile t-short" src="media/short.mp4" muted playsinline
             data-start="15" data-duration="9" data-track-index="3"></video>
      <video id="v-bump-1" class="clip tile t-bump" src="media/bumper.mp4" muted playsinline
             data-start="0" data-duration="6" data-track-index="4"></video>
      <video id="v-bump-2" class="clip tile t-bump" src="media/bumper.mp4" muted playsinline
             data-start="6" data-duration="6" data-track-index="5"></video>
      <video id="v-bump-3" class="clip tile t-bump" src="media/bumper.mp4" muted playsinline
             data-start="12" data-duration="6" data-track-index="6"></video>
      <video id="v-bump-4" class="clip tile t-bump" src="media/bumper.mp4" muted playsinline
             data-start="18" data-duration="6" data-track-index="7"></video>

      <section id="board" class="scene clip" data-start="0" data-duration="24" data-track-index="0">
        <div class="ring" id="r-full"></div><div class="ring" id="r-short"></div><div class="ring" id="r-bump"></div>
        <div class="len" id="n-full"><b>٢٤</b><span>ثانية</span></div>
        <div class="len" id="n-short"><b>١٥</b><span>ثانية</span></div>
        <div class="len" id="n-bump"><b>٦</b><span>ثواني</span></div>

        <div class="cap" id="k1"><div class="t">نفس الفيديو، <span class="x">بتلات أطوال.</span></div></div>
        <div class="cap" id="k2"><div class="t">أداة بتعمل الفيديو، وبتختصره <span class="x">من غير ما يفقد معناه.</span></div></div>
        <div class="cap" id="k3"><div class="t"><span class="x">الكامل</span> للبوست،</div></div>
        <div class="cap" id="k4"><div class="t"><span class="x">١٥ ثانية</span> للإعلان،</div></div>
        <div class="cap" id="k5"><div class="t">و<span class="x">٦ ثواني</span> قبل فيديوهات يوتيوب.</div></div>
        <div class="cap" id="k6"><div class="t">وكل نسخة ليها <span class="x">بداية ونهاية.</span></div></div>
        <div class="cap" id="k7"><div class="t">تابع — <span class="x">نوع جديد بكرة.</span></div>
          <div class="tag">video-production</div></div>
      </section>

      <!-- the full tour's own mix: it is the one that plays the whole way through -->
      <audio id="mix" src="media/full.mp4" data-start="0" data-duration="24"
             data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;
const END = 720;

const CH = [["k1", 0, 65], ["k2", 65, 196], ["k3", 196, 327], ["k4", 327, 458],
            ["k5", 458, 589], ["k6", 589, 655], ["k7", 655, 720]];
const TEXT = ["نفس الفيديو، بتلات أطوال.", "أداة بتعمل الفيديو، وبتختصره من غير ما يفقد معناه.",
              "الكامل للبوست،", "١٥ ثانية للإعلان،", "و٦ ثواني قبل فيديوهات يوتيوب.",
              "وكل نسخة ليها بداية ونهاية.", "تابع — نوع جديد بكرة. video-production"];
const DIM = "rgba(245,242,234,.22)", LIT = "#F5F2EA", ON = "#C77B0E";
const RINGS = ["full", "short", "bump"];
const LIGHT = [
  { full: LIT, short: LIT, bump: LIT }, { full: LIT, short: LIT, bump: LIT },
  { full: ON, short: DIM, bump: DIM },  { full: DIM, short: ON, bump: DIM },
  { full: DIM, short: DIM, bump: ON },  { full: ON, short: ON, bump: ON },
  { full: LIT, short: LIT, bump: LIT },
];

function build() {
  const tl = gsap.timeline({ paused: true });
  // a tl.set at 0 does not apply on frame 0; frame-0 state goes through gsap.set
  const put = (at, sel, v) => (at === 0 ? gsap.set(sel, v) : tl.set(sel, v, F(at)));

  CH.forEach(([id, s, e], i) => {
    put(s, "#" + id, { visibility: "visible" });
    if (e < END) tl.set("#" + id, { visibility: "hidden" }, F(e));
    RINGS.forEach((r) => put(s, "#r-" + r, { borderColor: LIGHT[i][r] }));
  });

  /* the mix is the tour's own, already normalised — a short fade at each end only */
  tl.fromTo("#mix", { volume: 0 }, { volume: 1, duration: F(3), ease: "none",
            immediateRender: false }, 0);
  tl.to("#mix", { volume: 0, duration: F(24), ease: "none" }, F(END - 24));

  CH.forEach(([id, s, e], i) =>
    mf(id, { type: "text", chapter: "board", frames: [s, e], still_from: s + 2,
             text: TEXT[i], critical: true, el: "#" + id }));
  [["n-full", "٢٤ ثانية"], ["n-short", "١٥ ثانية"], ["n-bump", "٦ ثواني"]].forEach(([id, t]) =>
    mf(id, { type: "text", chapter: "board", frames: [0, END], still_from: 0,
             text: t, critical: true, el: "#" + id }));
  // one entry per tile: the first clip marks where each length plays, all the way through
  [["full", "#v-full"], ["short", "#v-short-1"], ["bump", "#v-bump-1"]].forEach(([r, el]) => {
    mf("v-" + r, { type: "video", chapter: "board", frames: [0, END], still_from: 0,
                   critical: false, el });
    mf("r-" + r, { type: "shape", chapter: "board", frames: [0, END], still_from: 0,
                   critical: false, el: "#r-" + r });
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
