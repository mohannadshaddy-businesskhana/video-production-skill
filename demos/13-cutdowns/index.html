<!doctype html>
<!-- Demo 13 — cutdowns.  A timeline that shortens three times, with the marked
     segments surviving each pass. The horizontal track is this form's whole
     grammar — nothing else in the set is built on one.
     HOOK 0–3 · VALUE 3–14 · CTA 14–18 -->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>دقيقة تبقى ست ثواني</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; --pass-lt:#5E8F78; --fail-lt:#C3685A; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#14181F; }
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--bone); background:var(--ink); }
      .scene { position:absolute; inset:0; overflow:hidden; background:var(--ink); }
      .pane  { position:absolute; inset:0; direction:rtl; }
      .line  { position:absolute; right:88px; width:904px; font-weight:600;
               line-height:1.34; letter-spacing:-.01em; }
      .xl { font-size:84px; } .lg { font-size:58px; } .md { font-size:44px; }
      .amber { color:var(--amber); }

      /* the track — the grammar of this form */
      .trk { position:absolute; right:88px; height:96px; border-radius:10px;
             background:rgba(245,242,234,.10); border:4px solid rgba(245,242,234,.3);
             overflow:hidden; }
      .trk s { position:absolute; top:0; bottom:0; background:rgba(245,242,234,.22);
               display:block; text-decoration:none; }
      .trk s.keep { background:var(--amber); }
      .lbl { position:absolute; right:88px; font-family:"Mono",monospace; font-size:30px;
             letter-spacing:.1em; color:rgba(245,242,234,.65); direction:ltr;
             text-align:right; font-weight:700; }
      .dur { position:absolute; left:88px; font-family:"Mono",monospace; font-size:44px;
             color:var(--amber); font-weight:700; direction:ltr; }

      /* each cutdown, with its own hook and close */
      .cut { position:absolute; right:88px; width:904px;
             border:4px solid rgba(245,242,234,.3); border-radius:10px;
             background:rgba(245,242,234,.05); padding:18px 22px; display:flex;
             flex-direction:row-reverse; align-items:center; gap:18px; }
      .cut b { font-family:"Mono",monospace; font-size:34px; color:var(--amber);
               width:90px; flex:none; }
      .cut .seg { flex:1; display:flex; flex-direction:row-reverse; gap:8px; }
      .cut .seg u { flex:1; height:44px; border-radius:6px; display:block;
                    background:rgba(245,242,234,.2); text-decoration:none; }
      .cut .seg u.h { background:var(--amber); } .cut .seg u.c { background:var(--pass-lt); }

      .key { position:absolute; right:88px; width:904px; display:flex;
             flex-direction:row-reverse; gap:34px; font-family:"Mono",monospace;
             font-size:24px; letter-spacing:.08em; color:rgba(245,242,234,.65);
             font-weight:700; }
      .key span { display:flex; flex-direction:row-reverse; align-items:center; gap:10px; }
      .key i { width:26px; height:26px; border-radius:5px; display:block; }

      .name { position:absolute; right:88px; top:1520px; width:904px;
              font-family:"Mono",monospace; font-size:40px; letter-spacing:.06em;
              color:var(--amber); direction:ltr; text-align:right; font-weight:700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-fps="30" data-width="1080" data-height="1920">

      <section id="ch1" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="pane">
          <div class="line xl" id="h1" style="top:330px">دقيقة،<br>تلاتين،<br><span class="amber">ست ثواني.</span></div>
          <div class="trk" id="h2" style="top:1010px; width:904px"></div>
          <div class="trk" id="h3" style="top:1160px; width:452px"></div>
          <div class="trk" id="h4" style="top:1310px; width:150px"></div>
          <div class="dur" id="h5" style="top:1330px">0:06</div>
        </div>
      </section>

      <section id="ch2" class="scene clip" data-start="3" data-duration="6" data-track-index="1">
        <div class="pane">
          <div class="line lg" id="a1" style="top:280px">لو قصيت من الأول،<br>النسخة بتبقى ناقصة.</div>
          <div class="lbl" id="a2" style="top:640px">FULL CUT · 0:60</div>
          <div class="trk" id="a3" style="top:700px; width:904px"></div>
          <div class="lbl" id="a4" style="top:880px">NAIVE TRIM · 0:15</div>
          <div class="trk" id="a5" style="top:940px; width:226px"></div>
          <div class="line md" id="a6" style="top:1120px">الأداة بتعلّم المقاطع اللي بتقف لوحدها.</div>
          <div class="trk" id="a7" style="top:1300px; width:904px"></div>
          <div class="key" id="a8" style="top:1440px">
            <span><i style="background:#C77B0E"></i>خطّاف</span>
            <span><i style="background:#5E8F78"></i>قفلة</span>
            <span><i style="background:rgba(245,242,234,.25)"></i>باقي</span>
          </div>
        </div>
      </section>

      <section id="ch3" class="scene clip" data-start="9" data-duration="5" data-track-index="2">
        <div class="pane">
          <div class="line lg" id="b1" style="top:280px">كل نسخة ليها<br>خطّاف وقفلة.</div>
          <div class="cut" id="b2" style="top:660px"><b>0:30</b>
            <div class="seg"><u class="h"></u><u></u><u></u><u></u><u class="c"></u></div></div>
          <div class="cut" id="b3" style="top:830px"><b>0:15</b>
            <div class="seg"><u class="h"></u><u></u><u class="c"></u></div></div>
          <div class="cut" id="b4" style="top:1000px"><b>0:06</b>
            <div class="seg"><u class="h"></u><u class="c"></u></div></div>
          <div class="line md" id="b5" style="top:1220px">حتى الست ثواني.</div>
          <div class="key" id="b6" style="top:1400px">
            <span><i style="background:#C77B0E"></i>خطّاف</span>
            <span><i style="background:#5E8F78"></i>قفلة</span>
          </div>
        </div>
      </section>

      <section id="ch4" class="scene clip" data-start="14" data-duration="4" data-track-index="3">
        <div class="pane">
          <div class="line xl" id="c1" style="top:400px">علّق «<span class="amber">نسخ</span>»<br>وأبعتلك الطريقة.</div>
          <div class="trk" id="c2" style="top:940px; width:904px"></div>
          <div class="trk" id="c3" style="top:1080px; width:452px"></div>
          <div class="trk" id="c4" style="top:1220px; width:180px"></div>
          <div class="name" id="c5">video-production</div>
        </div>
      </section>

      <audio id="bgm" src="assets/music/bed.mp3" data-start="0" data-duration="18"
             data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;

/* which slices of a track are marked to survive a cutdown */
const FILL = {
  h2: [[0,10,1],[14,12,0],[30,9,1],[43,14,0],[60,11,1],[75,16,0]],
  h3: [[0,20,1],[26,18,0],[50,22,1]],
  h4: [[0,44,1],[52,40,1]],
  a3: [[0,10,1],[14,12,0],[30,9,1],[43,14,0],[60,11,1],[75,16,0]],
  a5: [[0,38,0],[44,40,0]],
  a7: [[0,10,1],[14,12,0],[30,9,1],[43,14,0],[60,11,1],[75,16,0]],
  c2: [[0,10,1],[14,12,0],[30,9,1],[43,14,0],[60,11,1],[75,16,0]],
  c3: [[0,20,1],[26,18,0],[50,22,1]],
  c4: [[0,44,1],[52,40,1]],
};

function build() {
  for (const [id, slices] of Object.entries(FILL)) {
    const t = document.getElementById(id);
    slices.forEach(([right, w, keep]) => {
      const s = document.createElement("s");
      s.style.right = right + "%"; s.style.width = w + "%";
      if (keep) s.className = "keep";
      t.appendChild(s);
    });
  }

  // initial state OUTSIDE the timeline — tl.set(…,0) does not apply at frame 0
  gsap.set(["#h1","#h2","#h3","#h4","#h5","#a1","#a2","#a3","#a4","#a5","#a6","#a7","#a8",
            "#b1","#b2","#b3","#b4","#b5","#b6","#c1","#c2","#c3","#c4","#c5"], { opacity: 0 });
  gsap.set(["#h1","#a1","#b1","#c1"], { y: 24 });
  gsap.set(["#h2","#h3","#h4","#a3","#a5","#a7","#c2","#c3","#c4"],
           { scaleX: 0, transformOrigin: "right center" });
  gsap.set(".cut", { opacity: 0, x: -24 });

  const tl = gsap.timeline({ paused: true });
  const rise = { opacity: 1, y: 0, ease: "power2.out" };
  const lay = { opacity: 1, scaleX: 1, ease: "power3.out" };

  /* ── HOOK · 0–90 — one track, then the same track twice shorter ── */
  tl.to("#h2", { ...lay, duration: F(12) }, F(0));
  tl.to("#h1", { ...rise, duration: F(14) }, F(3));
  tl.to("#h3", { ...lay, duration: F(9) }, F(14));
  tl.to("#h4", { ...lay, duration: F(7) }, F(24));
  tl.to("#h5", { opacity: 1, duration: F(8) }, F(32));

  /* ── VALUE · 90–270 — a naive trim beside a marked one ──────────── */
  tl.to("#a1", { ...rise, duration: F(14) }, F(96));
  tl.to("#a2", { opacity: 1, duration: F(8) }, F(120));
  tl.to("#a3", { ...lay, duration: F(12) }, F(126));
  tl.to("#a4", { opacity: 1, duration: F(8) }, F(146));
  tl.to("#a5", { ...lay, duration: F(9) }, F(152));
  tl.to("#a6", { opacity: 1, duration: F(14) }, F(174));
  tl.to("#a7", { ...lay, duration: F(12) }, F(196));
  tl.to("#a8", { opacity: 1, duration: F(10) }, F(212));

  /* ── VALUE · 270–420 — three cutdowns, each self-contained ──────── */
  tl.to("#b1", { ...rise, duration: F(14) }, F(276));
  tl.to(".cut", { opacity: 1, x: 0, duration: F(11), stagger: F(13),
                  ease: "power2.out" }, F(298));
  tl.to("#b5", { opacity: 1, duration: F(14) }, F(348));
  tl.to("#b6", { opacity: 1, duration: F(10) }, F(360));

  /* ── CTA · 420–540 ──────────────────────────────────────────────── */
  tl.to("#c1", { ...rise, duration: F(16) }, F(426));
  tl.to("#c2", { ...lay, duration: F(10) }, F(442));
  tl.to("#c3", { ...lay, duration: F(8) }, F(452));
  tl.to("#c4", { ...lay, duration: F(7) }, F(460));
  tl.to("#c5", { opacity: 1, duration: F(12) }, F(466));

  /* ── music — one continuous track, gain automation only (#26 #27) ─ */
  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.40, duration: 0.9, ease: "none",
            immediateRender: false }, 0);
  tl.to("#bgm", { volume: 0.29, duration: F(8), ease: "none" }, F(270));
  tl.to("#bgm", { volume: 0.40, duration: F(18), ease: "none" }, F(312));
  tl.to("#bgm", { volume: 0, duration: 1.3, ease: "none" }, F(501));

  const t = (id, ch, fr, still, text, crit) =>
    mf(id, { type: "text", chapter: ch, frames: fr, still_from: still, text: text,
             critical: crit !== false, el: "#" + id });
  const sh = (id, ch, fr, still) =>
    mf(id, { type: "shape", chapter: ch, frames: fr, still_from: still,
             critical: false, el: "#" + id });

  t("h1","ch1",[0,90],17,"دقيقة، تلاتين، ست ثواني.");
  sh("h2","ch1",[0,90],12); sh("h3","ch1",[0,90],23); sh("h4","ch1",[0,90],31);
  t("h5","ch1",[0,90],40,"",false);

  t("a1","ch2",[90,270],110,"لو قصيت من الأول، النسخة بتبقى ناقصة.");
  t("a2","ch2",[90,270],128,"",false);
  sh("a3","ch2",[90,270],138);
  t("a4","ch2",[90,270],154,"",false);
  sh("a5","ch2",[90,270],161);
  t("a6","ch2",[90,270],188,"الأداة بتعلّم المقاطع اللي بتقف لوحدها.");
  sh("a7","ch2",[90,270],208);
  t("a8","ch2",[90,270],222,"",false);

  t("b1","ch3",[270,420],290,"كل نسخة ليها خطّاف وقفلة.");
  sh("b2","ch3",[270,420],309); sh("b3","ch3",[270,420],322); sh("b4","ch3",[270,420],335);
  t("b5","ch3",[270,420],362,"حتى الست ثواني.");
  t("b6","ch3",[270,420],370,"",false);

  t("c1","ch4",[420,540],442,"علّق «نسخ» وأبعتلك الطريقة.");
  sh("c2","ch4",[420,540],452); sh("c3","ch4",[420,540],460); sh("c4","ch4",[420,540],467);
  t("c5","ch4",[420,540],478,"",false);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
