<!doctype html>
<!-- Demo 03 — launch video.  Amber field, a burst, hard edges, fast.
     HOOK 0–3 · VALUE 3–14 · CTA 14–18 -->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>فيديو إطلاق بصفر إنتاج</title>
    <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-arabic.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block;
        unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0898-08E1,U+08E3-08FF,U+FB50-FDFF,U+FE70-FEFF; }
      @font-face { font-family:"Cairo"; src:url("assets/fonts/cairo-latin.woff2") format("woff2");
        font-weight:200 1000; font-style:normal; font-display:block; }
      @font-face { font-family:"Mono"; src:url("assets/fonts/jetbrainsmono-latin.woff2") format("woff2");
        font-weight:700; font-style:normal; font-display:block; }
      :root { --ink:#14181F; --bone:#F5F2EA; --amber:#C77B0E; --pass:#2C6E52;
              --fail:#B23A2A; --white:#FFFFFF; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#C77B0E; }
      /* the launch film is the only one on a saturated field — it should read
         as an announcement across a feed, not as a document */
      #root { position:relative; width:100%; height:100%; overflow:hidden;
              font-family:"Cairo",sans-serif; color:var(--ink); background:var(--amber); }
      .scene { position:absolute; inset:0; overflow:hidden; background:var(--amber); }
      .pane  { position:absolute; inset:0; direction:rtl; }
      .line  { position:absolute; right:88px; width:904px; font-weight:700;
               line-height:1.3; letter-spacing:-.015em; }
      .xl { font-size:104px; } .lg { font-size:70px; } .md { font-size:54px; }

      .burst { position:absolute; left:50%; top:760px; width:620px; height:620px;
               margin-left:-310px; border-radius:50%; border:14px solid var(--ink); }
      .burst::after { content:"0"; position:absolute; inset:0; display:flex;
                      align-items:center; justify-content:center;
                      font-family:"Mono",monospace; font-size:300px; font-weight:700;
                      color:var(--ink); }
      .burstlbl { position:absolute; left:0; right:0; top:1440px; text-align:center;
                  font-family:"Mono",monospace; font-size:34px; letter-spacing:.2em;
                  color:var(--ink); font-weight:700; }

      /* the week that becomes a day */
      .cal { position:absolute; right:88px; top:1140px; width:904px; display:flex;
             flex-direction:row-reverse; gap:14px; }
      .d   { flex:1; height:150px; border:6px solid var(--ink); border-radius:8px;
             position:relative; background:rgba(20,24,31,.06); }
      .d.on { background:var(--ink); }
      .d.on::after { content:""; position:absolute; inset:26px; border-radius:6px;
                     background:var(--bone); }
      .d .x { position:absolute; inset:0; background:var(--amber);
              border-radius:4px; }
      .callbl { position:absolute; right:88px; top:1350px; width:904px;
                font-family:"Mono",monospace; font-size:30px; letter-spacing:.14em;
                direction:ltr; text-align:right; color:rgba(20,24,31,.75); font-weight:700; }

      /* four stages ticking */
      .stages { position:absolute; right:88px; top:900px; width:904px; }
      .st { display:flex; flex-direction:row-reverse; align-items:center; gap:26px;
            margin-bottom:34px; }
      .st .bx { width:74px; height:74px; border:7px solid var(--ink); border-radius:8px;
                position:relative; flex:none; }
      .st .bx::after { content:""; position:absolute; left:16px; top:10px; width:28px; height:48px;
                       border-right:9px solid var(--ink); border-bottom:9px solid var(--ink);
                       transform:rotate(42deg); opacity:0; }
      .st.on .bx::after { opacity:1; }
      .st span { font-size:52px; font-weight:700; }

      .name { position:absolute; right:88px; top:1500px; width:904px;
              font-family:"Mono",monospace; font-size:42px; letter-spacing:.06em;
              direction:ltr; text-align:right; font-weight:700; color:var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18"
         data-fps="30" data-width="1080" data-height="1920">

      <section id="ch1" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="pane">
          <div class="line xl" id="h1" style="top:330px">فيديو إطلاق<br>بصفر جنيه إنتاج.</div>
          <div class="burst" id="h2"></div>
          <div class="burstlbl" id="h3">PRODUCTION COST</div>
        </div>
      </section>

      <section id="ch2" class="scene clip" data-start="3" data-duration="6" data-track-index="1">
        <div class="pane">
          <div class="line lg" id="a1" style="top:320px">يوم الإطلاق،<br>أغلب الفرق بتنزل بوست.</div>
          <div class="line md" id="a2" style="top:640px">لإن الفيديو محتاج أسبوع وميزانية.</div>
          <div class="line md" id="a3" style="top:800px">الأداة دي بتخلّصه في نفس الجلسة.</div>
          <div class="cal" id="a4">
            <div class="d" id="d0"><div class="x"></div></div>
            <div class="d" id="d1"><div class="x"></div></div>
            <div class="d" id="d2"><div class="x"></div></div>
            <div class="d" id="d3"><div class="x"></div></div>
            <div class="d" id="d4"><div class="x"></div></div>
            <div class="d" id="d5"><div class="x"></div></div>
            <div class="d on" id="d6"></div>
          </div>
          <div class="callbl" id="a5">7 DAYS → 1</div>
        </div>
      </section>

      <section id="ch3" class="scene clip" data-start="9" data-duration="5" data-track-index="2">
        <div class="pane">
          <div class="line lg" id="b1" style="top:330px">سكريبت، بناء، فحص،<br>وتلات مقاسات.</div>
          <div class="line md" id="b2" style="top:660px">في وقت أقصر من اجتماع.</div>
          <div class="stages" id="b3">
            <div class="st" id="s0"><div class="bx"></div><span>سكريبت</span></div>
            <div class="st" id="s1"><div class="bx"></div><span>بناء</span></div>
            <div class="st" id="s2"><div class="bx"></div><span>فحص</span></div>
            <div class="st" id="s3"><div class="bx"></div><span>تلات مقاسات</span></div>
          </div>
        </div>
      </section>

      <section id="ch4" class="scene clip" data-start="14" data-duration="4" data-track-index="3">
        <div class="pane">
          <div class="line xl" id="c1" style="top:420px">الرابط في البايو —<br>جرّبها النهاردة.</div>
          <div class="burst" id="c2" style="top:1000px; width:360px; height:360px;
               margin-left:-180px; border-width:10px"></div>
          <div class="name" id="c3">video-production</div>
        </div>
      </section>

      <audio id="bgm" src="assets/music/bed.mp3" data-start="0" data-duration="18"
             data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
window.__FMT = { id: "vertical", w: 1080, h: 1920, safeTop: 230, safeBottom: 1690, zones: {} };
window.__MF = [];
window.__MOTION = [];
const mf = (id, o) => { window.__MF.push(Object.assign({ id }, o)); };
const F = (f) => f / 30;

function build() {
  const fade = ["#h1","#h3","#a1","#a2","#a3","#a4","#a5","#b1","#b2","#b3","#c1","#c3"];
  // initial state OUTSIDE the timeline — tl.set(…,0) does not apply at frame 0
  gsap.set(fade, { opacity: 0 });
  gsap.set(["#h2","#c2"], { opacity: 0, scale: 0.25, transformOrigin: "center" });
  gsap.set(["#h1","#a1","#b1","#c1"], { y: 24 });
  gsap.set(".d", { opacity: 0, scale: 0.7, transformOrigin: "center" });
  gsap.set(".d .x", { opacity: 0 });
  gsap.set(".st", { opacity: 0, x: -26 });
  gsap.set(".st .bx::after", {});   // pseudo-elements are toggled by class below

  const tl = gsap.timeline({ paused: true });
  const rise = { opacity: 1, y: 0, ease: "power2.out" };

  /* ── HOOK · 0–90 — the burst lands before the words ─────────────── */
  tl.to("#h2", { opacity: 1, scale: 1, duration: F(11), ease: "back.out(2)" }, F(0));
  tl.to("#h1", { ...rise, duration: F(12) }, F(4));
  tl.to("#h3", { opacity: 1, duration: F(10) }, F(14));

  /* ── VALUE · 90–270 — a week crossed out down to one day ────────── */
  tl.to("#a1", { ...rise, duration: F(14) }, F(96));
  tl.to("#a2", { opacity: 1, duration: F(12) }, F(136));
  tl.to("#a4", { opacity: 1, duration: F(2) }, F(150));
  tl.to(".d", { opacity: 1, scale: 1, duration: F(6), stagger: F(4),
                ease: "back.out(1.6)" }, F(150));
  tl.to(".d .x", { opacity: 1, duration: F(4), stagger: F(4) }, F(178));
  tl.to("#a3", { opacity: 1, duration: F(12) }, F(198));
  tl.to("#a5", { opacity: 1, duration: F(10) }, F(210));

  /* ── VALUE · 270–420 — four stages tick in ──────────────────────── */
  tl.to("#b1", { ...rise, duration: F(14) }, F(276));
  tl.to("#b2", { opacity: 1, duration: F(12) }, F(316));
  tl.to("#b3", { opacity: 1, duration: F(2) }, F(300));
  tl.to(".st", { opacity: 1, x: 0, duration: F(9), stagger: F(13),
                 ease: "power2.out" }, F(300));
  // the tick itself is a class, applied by a tween on a proxy so a seek to any
  // frame lands in the right state
  const ticks = [312, 325, 338, 351];
  const proxy = { n: 0 };
  tl.to(proxy, { n: 4, duration: F(56), ease: "none",
                 onUpdate: () => {
                   const upto = proxy.n;
                   document.querySelectorAll(".st").forEach((el, i) => {
                     el.classList.toggle("on", i < upto);
                   });
                 } }, F(310));

  /* ── CTA · 420–540 ──────────────────────────────────────────────── */
  tl.to("#c1", { ...rise, duration: F(16) }, F(426));
  tl.to("#c2", { opacity: 1, scale: 1, duration: F(12), ease: "back.out(2)" }, F(440));
  tl.to("#c3", { opacity: 1, duration: F(12) }, F(452));

  /* ── music — one continuous track, gain automation only (#26 #27) ─ */
  tl.fromTo("#bgm", { volume: 0 }, { volume: 0.40, duration: 0.9, ease: "none",
            immediateRender: false }, 0);
  tl.to("#bgm", { volume: 0.29, duration: F(8), ease: "none" }, F(270));
  tl.to("#bgm", { volume: 0.40, duration: F(18), ease: "none" }, F(310));
  tl.to("#bgm", { volume: 0, duration: 1.3, ease: "none" }, F(501));

  const t = (id, ch, fr, still, text, crit) =>
    mf(id, { type: "text", chapter: ch, frames: fr, still_from: still, text: text,
             critical: crit !== false, el: "#" + id });
  const sh = (id, ch, fr, still) =>
    mf(id, { type: "shape", chapter: ch, frames: fr, still_from: still,
             critical: false, el: "#" + id });

  t("h1","ch1",[0,90],16,"فيديو إطلاق بصفر جنيه إنتاج.");
  sh("h2","ch1",[0,90],11);
  t("h3","ch1",[0,90],24,"",false);

  t("a1","ch2",[90,270],110,"يوم الإطلاق، أغلب الفرق بتنزل بوست.");
  t("a2","ch2",[90,270],148,"لإن الفيديو محتاج أسبوع وميزانية.");
  t("a3","ch2",[90,270],210,"الأداة دي بتخلّصه في نفس الجلسة.");
  sh("a4","ch2",[90,270],206);
  t("a5","ch2",[90,270],220,"",false);

  t("b1","ch3",[270,420],290,"سكريبت، بناء، فحص، وتلات مقاسات.");
  t("b2","ch3",[270,420],328,"في وقت أقصر من اجتماع.");
  sh("b3","ch3",[270,420],366);

  t("c1","ch4",[420,540],442,"الرابط في البايو — جرّبها النهاردة.");
  sh("c2","ch4",[420,540],452);
  t("c3","ch4",[420,540],464,"",false);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
else build();
    </script>
  </body>
</html>
